<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钒渣提钒制V₂O₅ 三维虚拟仿真工厂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Microsoft YaHei",sans-serif}
#c{position:absolute;inset:0}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#ui>div{pointer-events:auto}
#topbar{position:absolute;top:0;left:0;right:0;height:48px;z-index:20;background:linear-gradient(90deg,#0d1b3e,#132655);border-bottom:2px solid #2a5bb8;display:flex;align-items:center;padding:0 16px;gap:14px}
#topbar .logo{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#4472C4,#63b3ed);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:16px}
#topbar h1{color:#fff;font-size:16px;font-weight:600}
#topbar .sub{color:#7fb3ff;font-size:11px}
#topbar .kpi{margin-left:auto;display:flex;gap:12px}
.kpi-item{text-align:center;color:#fff}
.kpi-item .v{font-size:15px;font-weight:bold;color:#63d2ff}
.kpi-item .l{font-size:9px;color:#9db8e8}
#left{position:absolute;left:10px;top:56px;width:220px;z-index:15;background:rgba(13,27,62,.9);border:1px solid #2a5bb8;border-radius:8px;padding:12px;max-height:calc(100vh - 80px);overflow-y:auto}
#left h3{color:#63b3ed;font-size:13px;margin:8px 0 4px}
.btn{display:block;width:100%;padding:7px;margin:3px 0;border:none;border-radius:5px;cursor:pointer;background:#1a3568;color:#d6e5ff;font-size:12px;text-align:left}
.btn:hover{background:#2a5bb8}
.btn.active{background:#4472C4;color:#fff}
.btn .b{float:right;font-size:9px;background:rgba(255,255,255,.15);padding:1px 5px;border-radius:6px}
#fault-input{width:100%;padding:6px;margin:4px 0;background:#0d1b3e;border:1px solid #2a5bb8;border-radius:5px;color:#d6e5ff;font-size:12px}
#data{position:absolute;right:10px;top:56px;width:300px;z-index:15;background:rgba(13,27,62,.92);border:1px solid #2a5bb8;border-radius:8px;padding:12px;max-height:calc(100vh - 200px);overflow-y:auto}
#data h3{color:#63b3ed;font-size:13px;display:flex;align-items:center;gap:6px}
#data h3 .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84}
#eq-title{font-size:16px;color:#fff;font-weight:bold;margin:6px 0 2px}
#eq-tag{color:#63b3ed;font-size:12px;font-weight:bold}
#eq-sec{color:#9db8e8;font-size:10px}
.ptable{width:100%;border-collapse:collapse;margin-top:8px}
.ptable td{padding:4px 6px;font-size:11px;color:#d6e5ff;border-bottom:1px solid #1a3568}
.ptable td:first-child{color:#9db8e8;width:45%}
.ptable td:last-child{text-align:right;font-family:Consolas,monospace;color:#63d2ff;font-weight:bold}
#alert{margin-top:8px;padding:8px;border-radius:5px;background:#3d1a1a;border:1px solid #b83030;color:#ffb3b3;font-size:12px;display:none}
#alert.show{display:block;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(184,48,48,.4)}50%{box-shadow:0 0 20px rgba(184,48,48,.8)}}
#alarm{position:absolute;bottom:8px;left:240px;right:320px;height:56px;z-index:15;background:rgba(13,27,62,.85);border:1px solid #2a5bb8;border-radius:6px;padding:8px 12px;overflow:hidden}
#alarm h4{color:#63b3ed;font-size:10px;margin-bottom:2px}
#alarm-list{font-size:11px;color:#d6e5ff;line-height:1.5}
#alarm-list .a{color:#ff8a8a}
#hint{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(13,27,62,.9);border:1px solid #2a5bb8;border-radius:16px;padding:5px 16px;color:#ffd54f;font-size:12px}
#load{position:fixed;inset:0;z-index:100;background:#0a1428;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#63d2ff;font-size:16px}
#load .spin{width:44px;height:44px;border:4px solid #1a3568;border-top-color:#4472C4;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.elabel{position:absolute;pointer-events:none;z-index:8}
.elabel .t{background:#0d1b3e;border:1px solid #4472C4;border-radius:3px;padding:1px 5px;color:#63d2ff;font-size:10px;font-weight:bold;white-space:nowrap}
/* ---- 仪表面板 ---- */
.isec{margin-top:9px;border-top:1px solid #1a3568;padding-top:6px}
.isec .h{color:#ffd54f;font-size:11px;font-weight:bold;margin-bottom:4px}
.itab{width:100%;border-collapse:collapse;font-size:10px}
.itab td{padding:2px 4px;border-bottom:1px solid #14294d;color:#cfe3f5}
.itab td.i0{color:#63d2ff;font-weight:bold;white-space:nowrap}
.itab td.i1{color:#9db8e8;font-size:9px}
.itab td.i2{text-align:right;font-family:Consolas,monospace;color:#7fffa8;font-weight:bold;white-space:nowrap}
.itab td.i2.a{color:#ff8a8a}
.itab tr.act{background:#2a1414}
.sisbox{margin-top:6px;padding:6px;border-radius:4px;background:#2a1414;border:1px solid #b83030;
font-size:10px;color:#ffb3b3;line-height:1.5;display:none}
.sisbox.on{display:block}
.sisbox .st{font-weight:bold;color:#ff6666}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div id="topbar">
  <div class="logo">钒</div>
  <div><h1>钒渣提钒制V₂O₅ 虚拟仿真工厂</h1><div class="sub">钠化焙烧 · 酸浸 · 萃取 · 沉钒 · 煅烧 — 年产500吨</div></div>
  <div class="kpi">
    <div class="kpi-item"><div class="v">36</div><div class="l">设备</div></div>
    <div class="kpi-item"><div class="v">8</div><div class="l">工段</div></div>
    <div class="kpi-item"><div class="v" id="kpi-st">正常</div><div class="l">状态</div></div>
  </div>
</div>
<div id="left">
  <h3>操作模式</h3>
  <button class="btn active" id="btn-walk">🚶 第一人称漫游 <span class="b">WASD</span></button>
  <button class="btn" id="btn-visit">🎥 自动巡览 <span class="b">8站</span></button>
  <button class="btn" id="btn-orbit">🖱 自由视角 <span class="b">拖拽</span></button>
  <h3>故障演练</h3>
  <input id="fault-input" placeholder="输入故障：焙烧超温/沉钒pH失控…" />
  <button class="btn" id="btn-fault">⚠ 触发故障</button>
  <button class="btn" id="btn-reset">↺ 全厂复位</button>
  <h3>工段跳转</h3>
  <button class="btn jz" data-z="raw">① 原料磨矿</button>
  <button class="btn jz" data-z="roast">② 钠化焙烧</button>
  <button class="btn jz" data-z="leach">③ 浸出分离</button>
  <button class="btn jz" data-z="ext">④ 萃取净化</button>
  <button class="btn jz" data-z="precip">⑤ 沉钒</button>
  <button class="btn jz" data-z="calc">⑥ 煅烧成品</button>
  <button class="btn jz" data-z="env">⑦ 环保公辅</button>
  <h3>仪表系统</h3>
  <button class="btn" id="btn-hmi">🖥 DCS 操作站（HMI）</button>
  <button class="btn" id="btn-instr">📡 三维仪表点位</button>
  <h3>运转与剖面</h3>
  <button class="btn active" id="btn-motion">⚙ 设备运转</button>
  <button class="btn" id="btn-speed">⏩ 转速 ×1</button>
  <button class="btn active" id="btn-flow">➤ 物料流向</button>
  <button class="btn" id="btn-section">🔪 剖切看内部</button>
  <h3>显示</h3>
  <button class="btn" id="btn-xray">👁 透明外壳</button>
  <button class="btn" id="btn-labels">🏷 设备标签</button>
  <button class="btn" id="btn-slow">🐢 慢速行走</button>
</div>
<div id="data">
  <h3><span class="dot" id="dot"></span> 实时工况</h3>
  <div id="eq-title">未选择设备</div>
  <div id="eq-tag">—</div>
  <div id="eq-sec">走近设备或点击面板选择</div>
  <table class="ptable" id="ptable"></table>
  <div id="alert"></div>
  <div id="inst-sec"></div>
  <div id="sis-sec"></div>
</div>
<div id="alarm"><h4>DCS 活动报警</h4><div id="alarm-list">无活动报警</div></div>
<div id="hint">点击画面进入漫游 · WASD移动 · Shift加速 · 鼠标环视</div>
</div>
<div id="load"><div class="spin"></div><span id="load-text">正在构建三维工厂…</span></div>

  function OrbitControls(camera, domElement) {
    this.camera = camera;
    this.dom = domElement;

        sphericalDelta.theta *= (1 - self.dampingFactor);
        sphericalDelta.phi *= (1 - self.dampingFactor);
      } else {
        spherical.theta += sphericalDelta.theta;
        spherical.phi += sphericalDelta.phi;
        sphericalDelta.theta = 0;
        sphericalDelta.phi = 0;
      }

      if (self.autoRotate) {
        spherical.theta += THREE.MathUtils.degToRad(self.autoRotateSpeed) * 0.01;
      }

      spherical.phi = THREE.MathUtils.clamp(spherical.phi, self.minPolarAngle, self.maxPolarAngle);
      spherical.radius = THREE.MathUtils.clamp(spherical.radius, self.minDistance, self.maxDistance);

      var sinPhi = Math.sin(spherical.phi);
      var cosPhi = Math.cos(spherical.phi);
      camera.position.set(
        self.target.x + spherical.radius * sinPhi * Math.sin(spherical.theta),
        self.target.y + spherical.radius * cosPhi,
        self.target.z + spherical.radius * sinPhi * Math.cos(spherical.theta)
      );
      camera.lookAt(self.target);
    };

    this.dispose = function () {
      domElement.removeEventListener('pointerdown', onPointerDown, false);
      domElement.removeEventListener('wheel', onWheel, false);
      domElement.removeEventListener('contextmenu', onCtxMenu, false);
    };
  }

    // ---- 耙架回转组（周边驱动浓密机 0.35 r/min，把沉泥刮向中心底流口）----

    // 耙齿（斜置刮板）
    for(var t=0;t<8;t++){

      tooth.rotation.y = 0.6; rake.add(tooth);

    // 中心驱动架（高 3.5m，真实周边/中心驱动特征）

    drive.position.y = 3.8; rake.add(drive);
    var driveTop = this._box(1.2, 0.6, 1.2, mm);
    driveTop.position.y = 4.7; rake.add(driveTop);

    var weir = this._tor(4.9, 0.09, mm);
    weir.rotation.x = Math.PI/2;
    weir.position.y = 2.8; g.add(weir);
    // 周边驱动（4 个行走小车，沿池壁）
    for(var i=0;i<4;i++){
      var a = i*Math.PI/2 + Math.PI/4;
      var cart = this._box(0.5, 0.35, 0.35, mm);
      cart.position.set(Math.cos(a)*4.95, 1.2, Math.sin(a)*4.95);
      g.add(cart);
    }

    g.scale.set(1.180, 0.900, 1.180);
    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(g);
    return g;
  },

  // S-201 钠化配料混合机
  'S-201': function(scene, eq){

    coneR.position.set(0.75, 1.5, 0); g.add(coneR);
    // 中心轴
    var axis = this._cyl(0.2, 0.2, 3.0, mm, 16);

    // 传动端

    var hopper = this._cyl(0.5, 0.2, 0.7, mm, 12);

    // 排料口
    var discharge = this._cyl(0.15, 0.15, 0.4, mm, 10);

      var leg2 = leg.clone(); leg2.position.z = -0.6; g.add(leg2);
    }

    
    // —— 运转机构（补）：双轴强制搅拌（两轴反向回转，钠化配料混匀）
    // 关键：每个轴 group 的原点必须落在【自身轴心】(0,0.95,±0.42) 上，
    // 子件相对轴心定位；_spin 省略 pivot 时自动取几何中心=轴心，
    // 这样两轴各自【原地自转】，不再绕设备中心公转（旧 bug）。
    for(var sa=0; sa<2; sa++){
      var zc = (sa===0 ? -0.42 : 0.42);
      var shaftG = new THREE.Group();
      shaftG.position.set(0, 0.95, zc);
      var sh = this._cyl(0.11, 0.11, 3.20, mm, 12);
      sh.rotation.z = Math.PI/2;

      for(var pb=0; pb<8; pb++){
        var pad = this._box(0.20, 0.42, 0.09, this.makePaint(0x99aabb));
        var px = -1.30 + pb*0.37;
        pad.position.set(px, 0, 0);
        pad.rotation.x = pb*0.8;
        shaftG.add(pad);
      }
      this._spin(shaftG, (sa===0 ? 62 : -62), 'x');
      g.add(shaftG);
    }
g.scale.set(1.140, 1.000, 1.000);
    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(g);
    return g;
  },

  // K-202 钠化焙烧回转窑（核心设备）
  // K-202 钠化焙烧回转窑 φ2.5×30 m（窑轴横贯车间：窑头 -X 进料+燃烧器，窑尾 +X 出料+排烟）
  'K-202': function(scene, eq){
    var g = new THREE.Group(); g.name = eq.tag;
    var pm = this.makePaint(0x8a5a3a);          // 窑筒体（耐热漆）
    var mm = this.makeMetal(0x555555);
    var concrete = this.makeConcrete();
    var glow = this.makeGlow(0xff3300);
    var refr = this.makePaint(0x9a7a60);        // 窑口耐火浇注料

    // ===== 规格锚点：筒体内径 2.5 m｜筒体长 30 m｜L/D=12｜斜度 3.5 %｜窑速 2.4 r/min =====
    var KL = 30.0;     // 筒体长度
    var KR = 1.25;     // 筒体半径（内径 2.5 m）
    var AY = 4.20;     // 窑中心线标高（托轮 + 基础 + 筒体半径决定）
    var TILT = 0.035;  // 斜度 3.5 %
    var tireR = 1.60;  // 轮带外半径
    var rolR  = 1.00;  // 托轮半径
    var CD = tireR + rolR;                 // 轮带—托轮中心距 = 2.60 m
    var supX = [-10.5, 0, 10.5];           // 3 档支承（跨度 10.5 m）

    // ---- 两列条形混凝土基础（沿窑轴 X 向，落在托轮正下方）----
    for(var r=0;r<2;r++){
      var fnd = this._box(35.0, 0.95, 1.6, concrete);
      fnd.position.set(0, 0.475, (r*2-1)*CD*0.5); g.add(fnd);
      // 基础顶预埋钢板
      var pl = this._box(34.0, 0.06, 1.2, mm);
      pl.position.set(0, 0.98, (r*2-1)*CD*0.5); g.add(pl);
    }

    // ---- 窑体运动层级：tilt（3.5% 斜度）→ spin（2.4 r/min 自转）----
    // 窑头(-X)高、窑尾(+X)低：绕 Z 轴转 -TILT
    var tilt = new THREE.Group();
    tilt.rotation.z = -TILT;
    g.add(tilt);
    var spin = new THREE.Group();
    this._spin(spin, 2.4, 'x', 0, AY, 0);      // 轴心落在窑中心线上
    tilt.add(spin);

    // ---- 托轮组 + 轮带（每档 2 个托轮，支承角 30°）----
    for(var i=0;i<supX.length;i++){
      var xc = supX[i];
      var cyy = AY - xc * TILT;                 // 该档处窑中心线标高
      for(var r=0;r<2;r++){
        var sz = (r*2-1) * CD * 0.5;            // ±1.30（横向）
        var syy = cyy - CD * 0.866;             // -2.25（竖向）
        var roller = this._cyl(rolR, rolR, 1.10, mm, 22);
        roller.rotation.z = Math.PI/2;          // 轴沿 X，与窑轴平行
        roller.position.set(xc, syy, sz);
        this._spin(roller, 8.6, 'x');           // 托轮被窑带动，n托 = n窑×D窑/D托
        g.add(roller);
        // 轴承座（从基础顶坐到托轮中心）
        var brgH = Math.max(syy - rolR - 0.95, 0.30);
        var brg = this._box(1.30, brgH, 1.10, this.makePaint(0x445566));
        brg.position.set(xc, 0.95 + brgH/2, sz); g.add(brg);
      }
      // 轮带（套在筒体上随窑回转）
      var tire = this._tor(tireR, 0.14, this.makePaint(0x6b4a33));
      tire.rotation.y = Math.PI/2;              // 环面法向转至 X 轴
      tire.position.set(xc, AY, 0); spin.add(tire);
      // 挡轮（液压挡轮，控制窑体轴向窜动）
      var thr = this._cyl(0.55, 0.55, 0.42, this.makePaint(0x556070), 16);
      thr.rotation.z = Math.PI/2;
      thr.position.set(xc + 1.9, AY - 2.15, 0); g.add(thr);
    }

    // ---- 筒体 + 耐火内衬 + 窑口护板 ----
    var shell = this._cyl(KR, KR, KL, pm, 40);
    shell.rotation.z = Math.PI/2;
    shell.position.set(0, AY, 0); spin.add(shell);
    // 耐火砖内衬（筒体内壁，剖切可见）
    var lining = this._cyl(KR-0.12, KR-0.12, KL-0.3, refr, 36);
    lining.rotation.z = Math.PI/2;
    lining.position.set(0, AY, 0); spin.add(lining);
    // 窑头端（-X，进料端，收口 + 窑口护铁）
    var head = this._cyl(KR, 0.72, 1.30, pm, 28);
    head.rotation.z = -Math.PI/2;
    head.position.set(-(KL/2+0.65), AY, 0); spin.add(head);
    var headR = this._cyl(0.78, 0.78, 0.30, refr, 24);
    headR.rotation.z = -Math.PI/2;
    headR.position.set(-(KL/2+1.30), AY, 0); spin.add(headR);
    // 窑尾端（+X，出料端，收口）
    var tail = this._cyl(0.72, KR, 1.30, pm, 28);
    tail.rotation.z = -Math.PI/2;
    tail.position.set(KL/2+0.65, AY, 0); spin.add(tail);
    var tailR = this._cyl(0.78, 0.78, 0.30, refr, 24);
    tailR.rotation.z = -Math.PI/2;
    tailR.position.set(KL/2+1.30, AY, 0); spin.add(tailR);
    // 大齿圈（窑中部偏窑头侧，随窑回转）
    var gearRing = this._cyl(1.92, 1.92, 0.42, this.makePaint(0xaa8833), 44);
    gearRing.rotation.z = Math.PI/2;
    gearRing.position.set(-4.5, AY, 0); spin.add(gearRing);
    // 窑内物料层（随窑翻滚，剖面可见）
    var bed = this._cyl(KR*0.60, KR*0.60, KL*0.94, this.makePaint(0x7a4a28), 24);
    bed.rotation.z = Math.PI/2;
    bed.position.set(0, AY - KR*0.45, 0); spin.add(bed);
    // 窑皮结圈示意的焙烧带高温发光
    var gl1 = this._sph(0.95, glow); gl1.position.set(-8, AY - 0.10, 0); g.add(gl1);
    var gl2 = this._sph(0.85, glow); gl2.position.set(0, AY - 0.20, 0); g.add(gl2);

    // ---- 传动装置：小齿轮 → 减速机 → 主电机（窑侧下方）----
    var pin = this._cyl(0.62, 0.62, 0.42, this.makePaint(0xcc9933), 22);
    pin.rotation.z = Math.PI/2;
    pin.position.set(-4.5, AY - 2.54, 0); this._spin(pin, 7.4, 'x'); g.add(pin);
    var gb = this._box(1.80, 1.40, 1.50, this.makePaint(0x3a5a7a));
    gb.position.set(-4.5, 1.55, 3.30); g.add(gb);
    var mot = this._cyl(0.55, 0.55, 1.90, this.makePaint(0x2a4a6a), 22);
    mot.rotation.z = Math.PI/2;
    mot.position.set(-4.5, 1.45, 5.20); this._spin(mot, 985, 'x'); g.add(mot);
    var coupling = this._cyl(0.24, 0.24, 0.70, mm, 12);
    coupling.rotation.z = Math.PI/2;
    coupling.position.set(-4.5, 1.50, 4.15); this._spin(coupling, 985, 'x'); g.add(coupling);

    // ---- 窑头：窑头罩 + 下料溜槽 + 燃烧器 + 一次风机 ----
    var hoodIn = this._box(3.20, 3.60, 3.20, this.makePaint(0x4a4a52));
    hoodIn.position.set(-(KL/2+3.10), AY + 0.15, 0); g.add(hoodIn);
    // 窑头罩耐火内衬
    var hoodRef = this._box(2.90, 3.30, 2.90, refr);
    hoodRef.position.set(-(KL/2+3.10), AY + 0.15, 0); g.add(hoodRef);
    var inChute = this._box(0.85, 3.20, 0.85, mm);
    inChute.position.set(-(KL/2+3.60), AY + 2.60, 0); g.add(inChute);
    var burner = this._cyl(0.32, 0.18, 3.20, mm, 16);
    burner.rotation.z = Math.PI/2;
    burner.position.set(-(KL/2+5.60), AY, 0); g.add(burner);
    var burnerGlow = this._sph(0.42, glow);
    burnerGlow.position.set(-(KL/2+2.20), AY, 0); g.add(burnerGlow);
    var gasPipe = this._cyl(0.14, 0.14, 2.20, this.makePaint(0xddaa00), 12);
    gasPipe.position.set(-(KL/2+5.60), AY + 1.30, 0); g.add(gasPipe);

    // ---- 窑尾：窑尾罩 + 出料溜槽（去冷却机）+ 排烟烟道（去除尘器）----
    var hoodOut = this._box(3.20, 3.60, 3.20, this.makePaint(0x4a4a52));
    hoodOut.position.set(KL/2+3.10, AY - 0.15, 0); g.add(hoodOut);
    // 出料溜槽（向下 +X 方向落到冷却机受料端）
    var outChute = this._box(1.00, 2.60, 1.00, mm);
    outChute.position.set(KL/2+3.40, AY - 2.20, 0); g.add(outChute);
    // 窑尾烟道（从窑尾罩顶部引出，真实：接袋式除尘器，不由窑自带烟囱）
    var ductV = this._cyl(0.85, 0.85, 3.20, mm, 18);
    ductV.position.set(KL/2+3.10, AY + 3.20, 0); g.add(ductV);
    var ductH = this._cyl(0.85, 0.85, 5.00, mm, 18);
    ductH.rotation.x = Math.PI/2;
    ductH.position.set(KL/2+3.10, AY + 4.70, 2.60); g.add(ductH);

    // ---- 窑头操作平台（钢格栅 + 栏杆，真实回转窑标配）----
    var plat = this._box(7.00, 0.10, 4.20, this.makePaint(0x8a8a8a));
    plat.position.set(-(KL/2+3.60), AY + 1.90, 0); g.add(plat);
    for(var pp=0;pp<4;pp++){
      var post = this._box(0.10, 4.30, 0.10, mm);
      post.position.set(-(KL/2+1.40) + (pp%2)*4.40, 2.15, (pp<2?-1.90:1.90)); g.add(post);
    }
    for(var hr=0;hr<2;hr++){
      var rail = this._box(7.00, 0.06, 0.06, this.makePaint(0xddaa00));
      rail.position.set(-(KL/2+3.60), AY + 2.90 + hr*0.55, (hr===0?-1.90:1.90)); g.add(rail);
    }

    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(g);
    return g;
  },

  // D-203 袋式除尘器
  'D-203': function(scene, eq){
    var g = new THREE.Group(); g.name = eq.tag;

    var mm = this.makeMetal(0x666666);

g.scale.set(2.400, 3.040, 2.330);

    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});

  },

  // C-204 链板式熟料冷却机 18×2.4 m（与窑平行布置，窑尾罩落料→链板输送→鼓风冷却→出料）
  'C-204': function(scene, eq){
    var g = new THREE.Group(); g.name = eq.tag;
    var pm = this.makePaint(0x5a6a5a);
    var mm = this.makeMetal(0x666666);
    var concrete = this.makeConcrete();
    var hot = this.makePaint(0x8a4a2a);

    var CL = 18.0;     // 链板有效长度
    var CW = 2.40;     // 链板宽度
    var CY = 1.55;     // 链板面标高（架高，下方为鼓风室）

    // 混凝土基础 + 支腿
    var base = this._box(CL+2.0, 0.40, CW+1.8, concrete);
    base.position.y = 0.20; g.add(base);
    for(var i=0;i<6;i++){
      var leg = this._box(0.22, 1.20, 0.22, this.makePaint(0x555f68));
      var lx = -CL/2 + 0.8 + i*(CL-1.6)/5;
      leg.position.set(lx, 0.90, -CW/2 - 0.5); g.add(leg);
      var leg2 = leg.clone(); leg2.position.z = CW/2 + 0.5; g.add(leg2);
    }
    for(var s=0;s<2;s++){
      var side = this._box(CL+1.0, 1.10, 0.14, pm);
      side.position.set(0, CY + 0.35, (s*2-1)*(CW/2 + 0.10)); g.add(side);
    }
    // 鼓风室（链板下方风箱）
    for(var k=0;k<3;k++){
      var box = this._box(CL/3 - 0.3, 0.85, CW, this.makePaint(0x44607a));
      box.position.set(-CL/2 + CL/6 + k*CL/3, CY - 0.55, 0); g.add(box);
      var air = this._cyl(0.30, 0.30, 0.6, mm, 12);
      air.rotation.x = Math.PI/2;

  // T-303 浸出矿浆浓密机（CCD 逆流洗涤）—— 真实结构：
  // 中心给料井 / 絮凝剂加药 / 周边溢流堰 / 中心驱动耙架 / 底流锥 / 底流泵 / 走桥
  // T-303 CCD 逆流洗涤浓密机 φ18 m 高效深锥型 —— 真实结构：
  //  混凝土池底 / 钢池壁 / 深锥浓缩区 / 中心给料井 / 絮凝剂加药 / 周边溢流堰
  //  中心驱动 + 耙架（扭矩保护）/ 底流锥口 + 底流泵 / 走桥 + 栏杆
  'T-303': function(scene, eq){
    var g = new THREE.Group(); g.name = eq.tag;
    var mm = this.makeMetal(0x777777);
    var concrete = this.makeConcrete();
    var steelWall = this.makePaint(0x4a6478);
    var handMat = this.makePaint(0xddaa00);

    var R  = 9.00;    // 池内半径（φ18 m）
    var WH = 4.00;    // 池壁高（池边水深 3.5 m + 超高 0.5 m）
    var BY = 0.60;    // 池底板上表面标高
    var CH = 2.60;    // 浓缩锥底高度（自底板向上收口）
    var WY = BY + WH; // 池壁顶标高 = 4.60 m

    // ① 混凝土池底板（φ18.6，厚 0.6 m，落地）
    var poolBase = this._cyl(R + 0.30, R + 0.30, 0.60, concrete, 48);
    poolBase.position.y = 0.30; g.add(poolBase);
    // 钢池壁（上薄下厚，带加强环）
    var wall = this._cyl(R, R - 0.15, WH, steelWall, 48);
    wall.position.y = BY + WH/2; g.add(wall);
    for(var w=0;w<3;w++){
      var ring = this._tor(R + 0.06, 0.07, mm);
      ring.rotation.x = Math.PI/2;
      ring.position.y = BY + 0.8 + w*1.35; g.add(ring);
    }
    // 深锥浓缩区（自池壁内收至中心底流口 φ0.9 m）
    var cone = this._cyl(R - 0.10, 0.45, CH, steelWall, 48);
    cone.position.y = BY + CH/2; g.add(cone);
    // 池壁顶走道（环形检修通道）
    var deck = this._tor(R + 0.55, 0.28, this.makePaint(0x8a8a8a));
    deck.rotation.x = Math.PI/2; deck.position.y = WY; g.add(deck);

    // ② 矿浆：下部密实层 + 上部澄清层（分界面 = 真实浓密机的泥水界面）
    var bed = this._cyl(R - 0.30, 0.90, 1.50, this.makeGlass(0x8a6a3a, 0.88), 44);
    bed.position.y = BY + 1.30; g.add(bed);
    var clear = this._cyl(R - 0.20, R - 0.20, 1.60, this.makeGlass(0x66aacc, 0.30), 44);
    clear.position.y = BY + 2.85; g.add(clear);

    // ③ 中心给料井（φ2.6 m，矿浆自中心给入，避免扰动沉降层）
    var feedWell = this._cyl(1.30, 1.30, 1.80, mm, 28);
    feedWell.position.y = WY + 0.30; g.add(feedWell);
    var fwRim = this._tor(1.30, 0.09, mm);
    fwRim.rotation.x = Math.PI/2; fwRim.position.y = WY + 1.20; g.add(fwRim);
    // 给料管（从池外跨池引至中心井，真实：架空敷设至中心）
    var feedPipe = this._cyl(0.22, 0.22, R + 2.2, mm, 14);
    feedPipe.rotation.z = Math.PI/2;
    feedPipe.position.set((R + 2.2)/2 - 1.2, WY + 1.35, 0); g.add(feedPipe);
    var fpCol = this._box(0.30, WY + 1.0, 0.30, mm);
    fpCol.position.set(R + 0.9, (WY + 1.0)/2, 0); g.add(fpCol);

    // ④ 絮凝剂加药（PAM 制备 + 计量泵 + 加药管，CCD 洗涤标配）
    var chemTank = this._cyl(0.90, 0.90, 1.80, this.makePaint(0x88aa55), 20);
    chemTank.position.set(R + 2.4, 0.90, 2.60); g.add(chemTank);
    var chemMotor = this._cyl(0.22, 0.22, 0.45, this.makePaint(0x2a4a6a), 14);
    chemMotor.position.set(R + 2.4, 1.95, 2.60); this._spin(chemMotor, 1400, 'y'); g.add(chemMotor);
    var chemPump = this._box(0.60, 0.45, 0.50, this.makePaint(0x2a4a6a));
    chemPump.position.set(R + 2.4, 0.55, 1.40); this._osc(chemPump, 0.04, 2.5, 'y'); g.add(chemPump);
    var chemPipe = this._cyl(0.08, 0.08, 3.20, this.makePaint(0x88aa55), 10);
    chemPipe.rotation.z = Math.PI/2;
    chemPipe.position.set(R + 0.9, 2.60, 2.00); g.add(chemPipe);

    // ⑤ 中心驱动装置（立式减速机 + 电机；浓密机关键检测 = 耙架扭矩）
    var driveCol = this._cyl(0.85, 0.85, 2.60, this.makePaint(0x456a88), 24);
    driveCol.position.y = WY + 2.30; g.add(driveCol);
    var driveHead = this._box(2.40, 1.00, 2.40, mm);
    driveHead.position.y = WY + 4.10; g.add(driveHead);
    var dMotor = this._cyl(0.42, 0.42, 1.20, this.makePaint(0x2a4a6a), 18);
    dMotor.position.set(1.30, WY + 4.90, 0); this._spin(dMotor, 1450, 'y'); g.add(dMotor);
    // 扭矩显示 + 提耙机构（压耙报警是浓密机最重要的保护）
    var torqueBox = this._box(0.60, 0.45, 0.16, this.makePaint(0xcc8833));
    torqueBox.position.set(-0.85, WY + 4.05, 1.25); g.add(torqueBox);
    var liftCyl = this._cyl(0.16, 0.16, 1.10, mm, 12);
    liftCyl.position.set(-1.30, WY + 4.60, 0); g.add(liftCyl);

    // ⑥ 耙架（双长臂 + 耙齿，0.12 r/min 慢速刮泥至中心底流口）
    var rake = new THREE.Group();
    var rakeShaft = this._cyl(0.28, 0.28, 3.20, mm, 16);
    rakeShaft.position.y = BY + 1.30; rake.add(rakeShaft);
    var hub = this._cyl(0.60, 0.60, 0.50, mm, 18);
    hub.position.y = BY + 2.90; rake.add(hub);
    for(var a=0;a<2;a++){
      var armLen = (R - 1.10) * 2;
      var arm = this._box(armLen, 0.22, 0.40, mm);
      arm.position.y = BY + 2.20; arm.rotation.y = a*Math.PI/2; rake.add(arm);
      // 桁架斜撑（长耙臂必须带拉杆）
      var rod = this._box(armLen*0.72, 0.08, 0.08, mm);
      rod.position.set(0, BY + 3.30, 0);
      rod.rotation.z = 0.32; rod.rotation.y = a*Math.PI/2; rake.add(rod);
      // 耙齿（斜置刮板）
      for(var i=0;i<9;i++){
        var t = -(R-1.45) + i*((R-1.45)*2/8);
        var tooth = this._box(0.85, 0.45, 0.12, this.makePaint(0x6a6a55));
        if(a===0){ tooth.position.set(t, BY + 1.85, 0.20); tooth.rotation.y = 0.6; }
        else     { tooth.position.set(0.20, BY + 1.85, t); tooth.rotation.y = 0.6; }
        rake.add(tooth);
      }
    }
    this._spin(rake, 0.12, 'y', 0, 0, 0);
    g.add(rake);

    // ⑦ 周边溢流堰 + 溢流槽（澄清液由此溢流去精滤/除杂）
    var weir = this._tor(R - 0.20, 0.10, mm);
    weir.rotation.x = Math.PI/2; weir.position.y = WY - 0.10; g.add(weir);
    var launder = this._tor(R + 0.22, 0.30, this.makePaint(0x3a5a70));
    launder.rotation.x = Math.PI/2; launder.position.y = WY - 0.30; g.add(launder);
    var overflow = this._cyl(0.26, 0.26, 2.00, mm, 14);
    overflow.rotation.x = Math.PI/2;
    overflow.position.set(0, WY - 0.90, R + 0.70); g.add(overflow);

    // ⑧ 底流锥口 + 底流泵（浓密底流送压滤机）
    var underPipe = this._cyl(0.28, 0.28, 4.20, mm, 14);
    underPipe.rotation.x = Math.PI/2;
    underPipe.position.set(0, 0.72, -2.10); g.add(underPipe);
    var underPump = this._cyl(0.55, 0.55, 0.90, this.makePaint(0xcc4444), 18);
    underPump.rotation.z = Math.PI/2;
    underPump.position.set(0, 0.72, -4.60); g.add(underPump);
    var pMotor = this._cyl(0.38, 0.38, 0.85, this.makePaint(0x2a4a6a), 16);
    pMotor.rotation.z = Math.PI/2;
    pMotor.position.set(1.30, 0.72, -4.60); this._spin(pMotor, 1470, 'x'); g.add(pMotor);
    this._osc(underPump, 0.03, 2.5, 'y');

    // ⑨ 走桥（池边 → 中心驱动，真实浓密机标配检修通道）
    var bridge = this._box(R + 0.60, 0.14, 1.30, mm);
    bridge.position.set((R + 0.60)/2, WY + 0.55, 0); g.add(bridge);
    for(var i=0;i<8;i++){
      var bx = 1.20 + i*(R - 1.60)/7;
      var post = this._cyl(0.05, 0.05, 1.10, mm, 6);
      post.position.set(bx, WY + 1.10, 0.58); g.add(post);
      var post2 = post.clone(); post2.position.z = -0.58; g.add(post2);
    }
    for(var h=0;h<2;h++){
      var handrail = this._cyl(0.05, 0.05, R + 0.60, mm, 6);
      handrail.rotation.z = Math.PI/2;
      handrail.position.set((R + 0.60)/2, WY + 1.55 + h*0.45, (h===0 ? 0.58 : -0.58));
      g.add(handrail);
    }
    // ⑩ 池边直梯（上走道用）
    var ladder = this._box(0.70, WY, 0.12, mm);
    ladder.position.set(R + 1.30, WY/2, 3.20); g.add(ladder);

    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(g);
    return g;
  },

  // ============================================================
  //  板框压滤机通用构建器 —— 严格按真实工业结构：
  //   两根主梁(工字梁) · 止推板(固定端,中心进料) · 压紧板(活动端)
  //   滤板/滤框交替组(各包滤布,滤框内为滤饼) · 板耳搭在主梁上
  //   中心进料管贯穿 · 明流水嘴 + 集液槽 · 液压站(油箱/油泵/油缸/油管)
  //   自动拉板小车 · 电控柜 · 操作平台与楼梯
  // ============================================================
  _filterPress: function(scene, eq, cfg){
    var g = new THREE.Group(); g.name = eq.tag;
    var mm  = this.makeMetal(0x707070);
    var pm  = this.makePaint(cfg.plateColor);
    var fm  = this.makePaint(cfg.frameColor);
    var concrete = this.makeConcrete();
    var clothMat = this.makePaint(0x3a4a5c);

    var N = cfg.plates;                  // 滤板+滤框总数
    var PW = cfg.plateW, PH = cfg.plateH;
    var pitch = cfg.pitch;               // 板中心距（含滤布厚度）
    var x0 = -((N-1)*pitch)/2;           // 板组居中
    var beamLen = cfg.beamLen;

    // ① 混凝土基础 + 钢底座
    var base = this._box(beamLen + 1.8, 0.35, 2.3, concrete);
    base.position.y = 0.175; g.add(base);

    // ② 四根支腿
    var legX = beamLen/2 - 0.35, legZ = 0.78;
    var legs = [[-legX,-legZ],[legX,-legZ],[-legX,legZ],[legX,legZ]];
    for(var L=0;L<4;L++){
      var leg = this._box(0.22, 1.05, 0.22, mm);
      leg.position.set(legs[L][0], 0.90, legs[L][1]); g.add(leg);
    }

    // ③ 两根主梁（沿 X 的工字梁：腹板 + 上下翼板）
    for(var b=0;b<2;b++){
      var bz = (b===0) ? -0.62 : 0.62;
      var web = this._box(beamLen, 0.26, 0.10, mm);
      web.position.set(0, 1.62, bz); g.add(web);
      var flg1 = this._box(beamLen, 0.06, 0.22, mm);
      flg1.position.set(0, 1.77, bz); g.add(flg1);
      var flg2 = this._box(beamLen, 0.06, 0.22, mm);
      flg2.position.set(0, 1.47, bz); g.add(flg2);
    }

    // ④ 止推板（固定端，带中心进料接管）
    var headX = -beamLen/2 + 0.18;
    var head = this._box(PW + 0.24, PH + 0.20, 0.16, this.makePaint(0x3d5a78));
    head.position.set(headX, 1.62, 0); g.add(head);
    var headBoss = this._cyl(0.13, 0.13, 0.32, mm, 16);
    headBoss.rotation.z = Math.PI/2;
    headBoss.position.set(headX - 0.24, 1.62, 0); g.add(headBoss);

    // ⑤ 压紧板（活动端，由油缸推动）
    var tailX = beamLen/2 - 0.58;
    var tail = this._box(PW + 0.24, PH + 0.20, 0.16, this.makePaint(0x3d5a78));
    tail.position.set(tailX, 1.62, 0); g.add(tail);

    // ⑥ 滤板 / 滤框 交替组（滤框内为滤饼，滤板两侧包滤布）
    for(var i=0;i<N;i++){
      var x = x0 + i*pitch;
      var isFrame = (i % 2 === 1);        // 奇数位 = 滤框（容纳滤饼）
      if (isFrame) {
        var frame = this._box(PW, PH, cfg.frameT, fm);
        frame.position.set(x, 1.62, 0); g.add(frame);
        var cake = this._box(PW*0.86, PH*0.86, cfg.frameT*0.70, this.makePaint(cfg.cakeColor));
        cake.position.set(x, 1.62, 0);
        cake.userData.isCake = true;      // 剖面模式下高亮滤饼
        g.add(cake);
      } else {
        var plate = this._box(PW, PH, cfg.plateT, pm);
        plate.position.set(x, 1.62, 0); g.add(plate);
        for(var s=-1;s<=1;s+=2){
          var cloth = this._box(PW*0.95, PH*0.93, 0.014, clothMat);
          cloth.position.set(x + s*(cfg.plateT/2 + 0.014), 1.62, 0);
          g.add(cloth);
        }
      }
      // 板耳（搭在主梁上的支撑耳，真实压滤机靠它悬挂滤板）
      for(var e=-1;e<=1;e+=2){
        var ear = this._box(0.17, 0.07, 0.17, mm);
        ear.position.set(x, 1.88, e*0.62); g.add(ear);
      }
      // 明流水嘴（每块板下方出液龙头）
      var cock = this._cyl(0.028, 0.028, 0.15, this.makeMetal(0xb0b8c0), 8);
      cock.position.set(x, 1.02, PW/2 + 0.22); g.add(cock);
    }

    // ⑦ 中心进料管（贯穿全部滤板中心孔）+ 进料法兰
    var feed = this._cyl(0.085, 0.085, (N-1)*pitch + 1.0, mm, 14);
    feed.rotation.z = Math.PI/2;
    feed.position.set(0, 1.62, 0); g.add(feed);
    var feedFl = this._cyl(0.18, 0.18, 0.05, mm, 16);
    feedFl.rotation.z = Math.PI/2;
    feedFl.position.set(headX - 0.45, 1.62, 0); g.add(feedFl);

    // ⑧ 明流集液槽 + 滤液出口管
    var trough = this._box((N-1)*pitch + 1.1, 0.30, 0.34, this.makePaint(0x556070));
    trough.position.set(0, 0.90, PW/2 + 0.22); g.add(trough);
    var outPipe = this._cyl(0.10, 0.10, 1.3, mm, 12);
    outPipe.rotation.z = Math.PI/2;
    outPipe.position.set(beamLen/2 - 0.15, 0.90, PW/2 + 0.22); g.add(outPipe);

    // ⑨ 液压站：油箱 + 油泵电机 + 油缸 + 高压油管 + 压力表
    var hyX = beamLen/2 + 1.05;
    var tank = this._box(1.10, 0.80, 0.74, this.makePaint(0x2f6a4a));
    tank.position.set(hyX, 0.75, 0); g.add(tank);
    var pump = this._cyl(0.17, 0.17, 0.44, this.makePaint(0x2a4a6a), 14);
    pump.rotation.z = Math.PI/2;
    pump.position.set(hyX, 1.30, 0); g.add(pump);
    this._spin(pump, 1450, 'x');
    var cyl = this._cyl(0.24, 0.24, 0.95, mm, 18);
    cyl.rotation.z = Math.PI/2;
    cyl.position.set(tailX + 0.76, 1.62, 0); g.add(cyl);
    var rod = this._cyl(0.11, 0.11, 0.58, this.makeMetal(0xc8ccd0), 12);
    rod.rotation.z = Math.PI/2;
    rod.position.set(tailX + 0.31, 1.62, 0); g.add(rod);
    var hose = this._cyl(0.045, 0.045, 1.6, this.makePaint(0x222222), 8);
    hose.rotation.z = Math.PI/2;
    hose.position.set(hyX - 0.65, 1.36, 0.32); g.add(hose);
    var gage = this._cyl(0.10, 0.10, 0.05, this.makeMetal(0xcfd6dd), 16);
    gage.rotation.x = Math.PI/2;
    gage.position.set(hyX, 1.66, 0.42); g.add(gage);

    // ⑩ 自动拉板小车（沿主梁往复，逐块拉开滤板卸饼）
    var cart = new THREE.Group();
    var cartBody = this._box(0.44, 0.26, 1.36, this.makePaint(0xcc7722));
    cartBody.position.y = 0; cart.add(cartBody);
    var cartArm = this._box(0.10, 0.46, 0.10, mm);
    cartArm.position.set(0, -0.32, 0); cart.add(cartArm);
    cart.position.set(x0, 2.16, 0);
    this._osc(cart, (N-1)*pitch/2 - 0.25, 0.10, 'x');
    g.add(cart);

    // ⑪ 电控柜
    var cab = this._box(0.64, 1.38, 0.44, this.makePaint(0x3a4a5a));
    cab.position.set(-beamLen/2 - 0.95, 0.74, 0.95); g.add(cab);
    var cabScreen = this._box(0.44, 0.32, 0.03, this.makePaint(0x2277aa));
    cabScreen.position.set(-beamLen/2 - 0.95, 1.18, 0.68); g.add(cabScreen);

    // ⑫ 操作平台 + 楼梯
    var plat = this._box(beamLen + 0.9, 0.10, 1.10, this.makePaint(0x5a6470));
    plat.position.set(0, 2.38, -1.30); g.add(plat);
    for(var st=0;st<6;st++){
      var step = this._box(0.78, 0.07, 0.28, this.makePaint(0x5a6470));
      step.position.set(beamLen/2 + 0.30, 0.35 + st*0.38, -1.30); g.add(step);
    }
    var prail = this._cyl(0.04, 0.04, beamLen + 0.9, mm, 6);
    prail.rotation.z = Math.PI/2;
    prail.position.set(0, 3.20, -1.78); g.add(prail);

    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(g);
    return g;
  },

  // P-303 尾渣板框压滤机（浸出尾渣脱水，800×800 板，26 板）
  'P-303': function(scene, eq){
    return this._filterPress(scene, eq, {

    });
  },

  // F-304 真空带式过滤机
  'F-304': function(scene, eq){
    var g = new THREE.Group(); g.name = eq.tag;
    var pm = this.makePaint(0x5a7a9a);
    var mm = this.makeMetal(0x666666);
    var concrete = this.makeConcrete();

    // 基础
    var base = this._box(4.5, 0.3, 2.0, concrete);
    base.position.y = 0.15; g.add(base);
    // 主箱体（卧式长条）
    var body = this._box(4.0, 1.0, 1.5, pm, 24);
    body.position.y = 1.0; g.add(body);
    // 上皮带（可见部分）
    for(var i=0;i<8;i++){
      var belt = this._box(0.45, 0.05, 1.4, mm);
      belt.position.set(-1.8 + i*0.48, 1.55, 0);
      g.add(belt);
    }
    // 端轮
    for(var r=0;r<2;r++){
      var wheel = this._cyl(0.4, 0.4, 1.5, mm, 20);

    }
    // 滤布（白色）
    var cloth = this._box(3.8, 0.03, 1.3, this.makePaint(0xeeeeee));

    // 进料斗（顶部）
    var hopper = this._cyl(0.5, 0.2, 0.6, mm, 12);
    hopper.rotation.x = Math.PI;
    hopper.position.set(-1.0, 1.9, 0); g.add(hopper);
    // 真空盒
    var vacuumBox = this._box(1.0, 0.8, 1.4, this.makePaint(0x445566));
    vacuumBox.position.set(0.5, 0.6, 0); g.add(vacuumBox);
    // 驱动电机
    var motor = this._cyl(0.2, 0.2, 0.5, this.makePaint(0x2a4a6a), 14);
    motor.rotation.x = Math.PI/2;
    motor.position.set(2.3, 1.0, 0.8); g.add(motor);

    
    // —— 运转机构（补）：过滤进料泵（精密过滤靠泵压推动）
    var fp = this._cyl(0.24, 0.24, 0.52, this.makePaint(0xcc4444), 16);
    fp.rotation.z = Math.PI/2;
    fp.position.set(-1.55, 0.50, 0.75); this._spin(fp, 1470, 'x'); g.add(fp);
    var fpm = this._cyl(0.19, 0.19, 0.56, this.makePaint(0x2a4a6a), 14);
    fpm.rotation.z = Math.PI/2;
    fpm.position.set(-1.55, 0.50, 1.38); this._spin(fpm, 1470, 'x'); g.add(fpm);
g.scale.set(0.900, 1.200, 1.200);
    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(g);
    return g;
  },

  // E-401 萃取-反萃混合澄清槽（5 联器，核心设备）
  'E-401': function(scene, eq){
    var g = new THREE.Group(); g.name = eq.tag;
    var pm = this.makePaint(0x7a5aaa);
    var mm = this.makeMetal(0x666666);
    var concrete = this.makeConcrete();

    // 长条形基础
    var base = this._box(9.5, 0.4, 3.6, concrete);
    base.position.y = 0.2; g.add(base);

    // 5 个串联澄清槽（单级直径 1.4m，真实工业澄清槽尺度）
    for(var i=0;i<5;i++){
      var cx = -3.8 + i*1.9;
      // 槽体（圆柱形，高 3.0m）
      var clarifier = this._cyl(0.7, 0.7, 3.0, pm, 24);
      clarifier.position.set(cx, 1.95, 0);
      g.add(clarifier);
      // 槽盖
      var lid = this._cyl(0.72, 0.72, 0.12, mm, 24);
      lid.position.set(cx, 3.5, 0); g.add(lid);
      // 双层液面
      // 水相（下层，蓝绿色）
      var aqueous = this._cyl(0.65, 0.65, 0.7, this.makeGlass(0x4a8a9a, 0.45), 20);
      aqueous.position.set(cx, 1.15, 0); g.add(aqueous);
      // 有机相（上层，棕红色）
      var organic = this._cyl(0.65, 0.65, 0.8, this.makeGlass(0xaa5533, 0.45), 20);
      organic.position.set(cx, 2.25, 0); g.add(organic);
      // 搅拌电机（每槽一个小电机）
      var motor = this._cyl(0.15, 0.15, 0.5, this.makePaint(0x2a4a6a), 12);
      motor.position.set(cx, 3.85, 0); g.add(motor);
      // 搅拌器（混合室搅拌桨，使两相充分接触后进入澄清室分相）
      var mixerGrp = new THREE.Group();
      mixerGrp.position.set(cx, 0, 0);
      var shaftE = this._cyl(0.06, 0.06, 1.8, mm, 8);
      shaftE.position.y = 2.6; mixerGrp.add(shaftE);
      var impE = this._cyl(0.26, 0.26, 0.06, mm, 14);
      impE.position.y = 1.80; mixerGrp.add(impE);
      for(var b=0;b<4;b++){
        var ib = this._box(0.24, 0.14, 0.05, mm);
        ib.position.y = 1.80; ib.rotation.y = b*Math.PI/2; mixerGrp.add(ib);
      }
      this._spin(mixerGrp, 180, 'y');
      g.add(mixerGrp);
      // 混合器（槽间连接短管）
      var mixer = this._cyl(0.14, 0.14, 0.5, mm, 8);
      mixer.rotation.z = Math.PI/2;
      mixer.position.set(cx + (i<4?0.95:0), 3.4, 0);
      if(i<4) g.add(mixer);
    }

    // 进料/出料管
    var feed = this._cyl(0.15, 0.15, 1.2, mm, 10);
    feed.rotation.z = Math.PI/2;
    feed.position.set(-4.8, 2.4, 0); g.add(feed);
    var product = this._cyl(0.15, 0.15, 1.2, mm, 10);
    product.rotation.z = Math.PI/2;
    product.position.set(4.8, 2.4, 0); g.add(product);

    g.scale.set(1.670, 0.630, 1.000);
    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(g);
    return g;
  },

  // X-502 离子交换柱
  'X-502': function(scene, eq){
    var g = new THREE.Group(); g.name = eq.tag;
    var pm = this.makePaint(0x8a5a4a);

    var ixMot = this._cyl(0.19, 0.19, 0.56, this.makePaint(0x2a4a6a), 14);
    ixMot.rotation.z = Math.PI/2;

g.scale.set(3.080, 1.670, 2.000);
    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});

  },

  // P-501 沉钒反应器（核心设备）
  'P-501': function(scene, eq){

  // K-601 APV 煅烧回转窑 φ1.6×26 m（间接加热，多钒酸铵分解制 V₂O₅）
  // 真实结构：筒体+轮带托轮+齿圈传动 / 窑头进料螺旋 / 窑尾出料+氨气引出 / 加热炉膛 / 烟囱
  'K-601': function(scene, eq){
    var g = new THREE.Group(); g.name = eq.tag;
    var pm = this.makePaint(0x8a4a2a);
    var mm = this.makeMetal(0x555555);
    var concrete = this.makeConcrete();
    var glow = this.makeGlow(0xff4400);
    var refr = this.makePaint(0x9a7a60);

    var KL = 26.0;     // 筒体长度
    var KR = 0.80;     // 筒体半径（内径 1.6 m）
    var AY = 3.10;     // 窑中心线标高
    var TILT = 0.025;  // 斜度 2.5 %
    var tireR = 1.02, rolR = 0.62;
    var CD = tireR + rolR;
    var supX = [-8.5, 8.5];            // 2 档支承

    // 基础
    for(var r=0;r<2;r++){
      var fnd = this._box(31.0, 0.80, 1.20, concrete);
      fnd.position.set(0, 0.40, (r*2-1)*CD*0.5); g.add(fnd);
    }
    // 窑体：tilt → spin
    var tilt = new THREE.Group();
    tilt.rotation.z = -TILT;
    g.add(tilt);
    var spin = new THREE.Group();
    this._spin(spin, 1.2, 'x', 0, AY, 0);      // 窑速 1.2 r/min
    tilt.add(spin);
    // 托轮 + 轮带
    for(var i=0;i<supX.length;i++){
      var xc = supX[i];
      var cyy = AY - xc*TILT;
      for(var r=0;r<2;r++){
        var sz = (r*2-1)*CD*0.5;
        var rol = this._cyl(rolR, rolR, 0.80, mm, 18);
        rol.rotation.z = Math.PI/2;
        rol.position.set(xc, cyy - CD*0.866, sz);
        this._spin(rol, 2.6, 'x'); g.add(rol);
        var brgH = Math.max(cyy - CD*0.866 - rolR - 0.80, 0.28);
        var brg = this._box(0.90, brgH, 0.80, this.makePaint(0x445566));
        brg.position.set(xc, 0.80 + brgH/2, sz); g.add(brg);
      }
      var tire = this._tor(tireR, 0.10, this.makePaint(0x6b4a33));
      tire.rotation.y = Math.PI/2;
      tire.position.set(xc, AY, 0); spin.add(tire);
    }
    // 筒体 + 内衬 + 物料
    var shell = this._cyl(KR, KR, KL, pm, 32);
    shell.rotation.z = Math.PI/2; shell.position.set(0, AY, 0); spin.add(shell);
    var lining = this._cyl(KR-0.08, KR-0.08, KL-0.2, refr, 28);
    lining.rotation.z = Math.PI/2; lining.position.set(0, AY, 0); spin.add(lining);
    var bed = this._cyl(KR*0.55, KR*0.55, KL*0.92, this.makePaint(0xcc8844), 20);
    bed.rotation.z = Math.PI/2; bed.position.set(0, AY - KR*0.45, 0); spin.add(bed);
    // 大齿圈 + 传动
    var gearRing = this._cyl(1.22, 1.22, 0.32, this.makePaint(0xaa8833), 32);
    gearRing.rotation.z = Math.PI/2; gearRing.position.set(-3.0, AY, 0); spin.add(gearRing);
    var pin = this._cyl(0.40, 0.40, 0.32, this.makePaint(0xcc9933), 18);
    pin.rotation.z = Math.PI/2; pin.position.set(-3.0, AY - 1.62, 0); this._spin(pin, 3.9, 'x'); g.add(pin);
    var gb = this._box(1.20, 1.00, 1.10, this.makePaint(0x3a5a7a));
    gb.position.set(-3.0, 1.30, 2.20); g.add(gb);
    var mot = this._cyl(0.38, 0.38, 1.30, this.makePaint(0x2a4a6a), 18);
    mot.rotation.z = Math.PI/2; mot.position.set(-3.0, 1.20, 3.50); this._spin(mot, 985, 'x'); g.add(mot);

    // 窑头（-X）：进料螺旋 + 窑头罩
    var hoodIn = this._box(2.20, 2.40, 2.20, this.makePaint(0x4a4a52));
    hoodIn.position.set(-(KL/2+2.30), AY, 0); g.add(hoodIn);
    var screw = this._cyl(0.22, 0.22, 2.80, mm, 14);
    screw.rotation.z = Math.PI/2;
    screw.position.set(-(KL/2+4.00), AY, 0); this._spin(screw, 65, 'x'); g.add(screw);
    var hopper = this._cyl(0.70, 0.30, 1.20, this.makePaint(0x446688), 18);
    hopper.position.set(-(KL/2+4.60), AY + 1.20, 0); g.add(hopper);
    // 窑尾（+X）：出料罩 + 出料溜槽 + NH₃ 引出管（去氨回收塔）
    var hoodOut = this._box(2.20, 2.40, 2.20, this.makePaint(0x4a4a52));
    hoodOut.position.set(KL/2+2.30, AY, 0); g.add(hoodOut);
    var outChute = this._box(0.80, 1.80, 0.80, mm);
    outChute.position.set(KL/2+2.60, AY - 1.90, 0); g.add(outChute);
    var nh3 = this._cyl(0.22, 0.22, 3.20, this.makePaint(0x88cc44), 12);
    nh3.position.set(KL/2+2.30, AY + 2.40, 0); g.add(nh3);
    // 加热炉膛（筒体下方，燃气烧嘴分段加热，带观火孔）
    var chamber = this._box(KL - 3.0, 1.60, 3.40, this.makePaint(0x5a4a44));
    chamber.position.set(0, 0.95, 0); g.add(chamber);
    for(var b=0;b<5;b++){
      var burn = this._cyl(0.14, 0.09, 0.70, mm, 10);
      burn.rotation.x = Math.PI/2;
      burn.position.set(-KL/2 + 3.0 + b*5.0, 1.10, 1.85); g.add(burn);
      var fl = this._sph(0.20, glow);
      fl.position.set(-KL/2 + 3.0 + b*5.0, 1.10, 1.55); g.add(fl);
      var peek = this._cyl(0.09, 0.09, 0.05, this.makeGlass(0xffcc88, 0.6), 8);
      peek.rotation.x = Math.PI/2;
      peek.position.set(-KL/2 + 4.5 + b*5.0, 1.30, -1.75); g.add(peek);
    }
    // 检修平台 + 栏杆
    var plat = this._box(KL, 0.10, 1.20, this.makePaint(0x8a8a8a));
    plat.position.set(0, AY + 1.60, -2.60); g.add(plat);
    for(var h=0;h<2;h++){
      var rail = this._box(KL, 0.06, 0.06, this.makePaint(0xddaa00));
      rail.position.set(0, AY + 2.10 + h*0.50, -3.10); g.add(rail);
    }

    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(g);
    return g;
  },

  // R-305 除杂反应槽（φ5×5.5 m，除硅除磷，药剂加入 + 机械搅拌）

    for(var i=0;i<5;i++){

    this._spin(ag, 52, 'y');
    g.add(ag);
    // 药液加入管（顶部三根：MgSO₄ / NH₄Cl / 碱液）

  // E-504 沉钒母液三效蒸发结晶（加热室 + 分离室 + 冷凝器 + 结晶器）
  'E-504': function(scene, eq){
    var g = new THREE.Group(); g.name = eq.tag;
    var pm = this.makePaint(0x5a7a8a);
    var mm = this.makeMetal(0x777777);
    var concrete = this.makeConcrete();

    var base = this._box(8.0, 0.45, 5.2, concrete);
    base.position.y = 0.225; g.add(base);
    // 三效：每效 = 立式加热室（列管换热器）+ 分离室（大直径筒）+ 循环管
    for(var e=0;e<3;e++){
      var ex = -2.7 + e*2.7;

      var heat = this._cyl(0.62, 0.62, 3.0, this.makePaint(0x4a6a7a), 22);
      heat.position.set(ex, 1.95, -1.3); g.add(heat);
      for(var t=0;t<3;t++){

        tb.rotation.x = Math.PI/2;
        tb.position.set(ex, 1.0 + t*0.95, -1.3); g.add(tb);
      }
      // 分离室（直径更大，二次蒸汽在此分离）
      var sep = this._cyl(1.05, 1.05, 2.4, pm, 26);
      sep.position.set(ex, 2.55, 1.0); g.add(sep);
      var dome = this._sph(1.05, pm, 20);
      dome.scale.y = 0.40; dome.position.set(ex, 3.75, 1.0); g.add(dome);

      var cone = this._cyl(1.05, 0.28, 1.0, pm, 26);
      cone.position.set(ex, 0.85, 1.0); g.add(cone);
      // 循环管（加热室 ↔ 分离室，自然循环）
      var loop = this._cyl(0.22, 0.22, 2.4, mm, 12);

      // 视镜
      var sight = this._cyl(0.16, 0.16, 0.06, this.makeGlass(0xaaddff, 0.6), 12);

    var pump = this._cyl(0.28, 0.28, 0.55, this.makePaint(0x446688), 16);
    pump.rotation.z = Math.PI/2;
    pump.position.set(-4.2, 0.75, 1.8); this._spin(pump, 1470, 'x'); g.add(pump);
    var pmot = this._cyl(0.20, 0.20, 0.6, this.makePaint(0x2a4a6a), 14);
    pmot.rotation.z = Math.PI/2;
    pmot.position.set(-4.2, 0.75, 2.5); this._spin(pmot, 1470, 'x'); g.add(pmot);

    }

    g.position.set(eq.pos[0], 0, eq.pos[2]);
    g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(g);
    return g;
  },

<script>
/* ===== 内联: lib/pipes.js ===== */
// ============================================================
// 管线系统 — 按真实化工厂「管廊敷设」方式构建
// ------------------------------------------------------------
// 真实工厂管线不是从设备顶部凌空飞过，而是：
//   ① 从设备侧壁的接管口（低标高）引出
//   ② 沿管廊（管墩/支架支撑）低标高敷设，走直角折线
//   ③ 到目的地后立管升起，接入下一台设备的接管口
// 本模块按此逻辑生成：接口点 → 立管 → 水平管廊 → 立管 → 接口点
// 并配套管墩、管卡、弯头、闸阀、色环等管件
// ============================================================

var PIPE_DEFS = [
  // [起点设备tag, 终点设备tag, 钢管公称半径(m), 颜色, 介质类型, 名称]

// 管廊敷设标高（管中心）。真实工厂低管廊 0.8~1.2 m，跨路段抬高到 4.5 m
var RACK_Y    = 1.05;
var RACK_HIGH = 4.60;   // 跨越厂区道路时的桁架标高

// 保温层厚度：管道外径 = 钢管半径 + 保温层（真实工业管道多带保温）
var INSUL = 0.07;

// 管线路径缓存：buildPipes() 后填充，每条管线一组路径点（Vector3 数组）
// 用途：① 物料流动指示沿路径移动 ② 流量计/压力变送器按真实做法装在管道上
var PIPE_ROUTES = [];

// ============================================================
//  接管口定位：射线实测设备真实表面
//  ----------------------------------------------------------
//  说明：PORTS 里的 sx/sz 是早期按名义尺寸标定的矩形半跨，
//  在设备改为 1:1 真实尺寸后已失真（如回转窑实际筒体半径仅 0.75 m，
//  而 PORTS 写 sx=2.80 → 接管口被推到距窑壳 3.9 m 的空中，
//  造成"管道既没来处也没去处"）。故改为对已建好的设备网格发射线，
//  命中真实壳体表面后再沿外法向让接管法兰伸出 0.30 m。
// ============================================================
function buildPipes(scene, equipMeshes) {
  var B = EQUIP_BUILDERS;
  var _surfCache = {};

  // 射线实测接管口前，必须保证设备世界矩阵是最新
  if (scene) scene.updateMatrixWorld(true);
  // ---------- 材质 ----------
  var pipeMat = {
    solid:   B.makePaint(0x9a9a9a),   // 固相/粉料 — 灰
    hot:     B.makePaint(0xcc6633),   // 热料/烟气 — 橙红（带保温）
    liquid:  B.makePaint(0x33aa77),   // 料液 — 绿
    organic: B.makePaint(0x9966cc),   // 有机相 — 紫
    acid:    B.makePaint(0xaa8833),   // 酸 — 土黄
    steam:   B.makePaint(0xcc5533),   // 蒸汽 — 红
    air:     B.makePaint(0x88aadd)    // 仪表风 — 浅蓝
  };
  var steelMat    = B.makeMetal(0x7a838c);
  var concreteMat = B.makeConcrete();
  var pierCount = 0, segCount = 0, routeAvoid = 0;
  var _pairCount = {};

  // ---------- 设备包围盒（用于管线避障选路） ----------
  var EQUIP_BOXES = [];
  if (typeof equipMeshes !== 'undefined' && equipMeshes) {
    equipMeshes.forEach(function(g, tag) {
      EQUIP_BOXES.push({tag: tag, box: new THREE.Box3().setFromObject(g)});
    });
  }
  // 点是否落在"非本管线所连设备"的本体范围内（真实工厂管廊必须绕开设备基础）
  function pointInsideEquip(p, exclA, exclB) {
    for (var i = 0; i < EQUIP_BOXES.length; i++) {
      var e = EQUIP_BOXES[i];
      if (e.tag === exclA || e.tag === exclB) continue;
      if (e.box.containsPoint(p)) return true;
    }
    return false;
  }

  // ---------- 设备中心 ----------
  var centerOf = {};
  EQUIPMENT.forEach(function(e){ centerOf[e.tag] = {x: e.pos[0], z: e.pos[2]}; });

  // ---------- 求设备表面接管口：射线实测真实壳体 ----------
  //        命中不了（极少数）才退回 PORTS 矩形近似
  function surfacePoint(tag, towardX, towardZ) {
    var c = centerOf[tag];
    var p = PORTS[tag] || {sx: 1.5, sz: 1.5, portY: 1.2};
    if (!c) return new THREE.Vector3(0, 1, 0);
    var host = (typeof equipMeshes !== 'undefined' && equipMeshes) ? equipMeshes.get(tag) : null;

    if (host) {
      var key = tag + '|' + towardX.toFixed(1) + '|' + towardZ.toFixed(1);
      if (_surfCache[key]) return _surfCache[key].clone();

      var box = new THREE.Box3().setFromObject(host);
      var cc = box.getCenter(new THREE.Vector3());
      var dx = towardX - cc.x, dz = towardZ - cc.z;
      var len = Math.sqrt(dx*dx + dz*dz);
      if (len < 0.01) { dx = 1; dz = 0; len = 1; }
      var ux = dx/len, uz = dz/len;

      // 接管标高候选：设计接管标高 → 收进设备真实标高范围 → 设备中部
      var yLo = box.min.y + 0.4;
      var yHi = Math.max(box.min.y + 0.9, box.max.y - 0.4);
      var yc  = Math.max(yLo, Math.min(p.portY, yHi));
      var tryY = [p.portY, yc, (box.min.y + box.max.y) / 2];
      // 方向候选：指向对方设备 → 轴向兜底（细长设备如回转窑）
      var dirs = [[ux, uz], [ux >= 0 ? 1 : -1, 0], [0, uz >= 0 ? 1 : -1]];

      for (var d = 0; d < dirs.length; d++) {
        for (var k = 0; k < tryY.length; k++) {
          var origin = new THREE.Vector3(cc.x + dirs[d][0]*50, tryY[k], cc.z + dirs[d][1]*50);
          var ray = new THREE.Raycaster(origin,
            new THREE.Vector3(-dirs[d][0], 0, -dirs[d][1]), 0.1, 100);
          var hits = ray.intersectObject(host, true);
          if (hits.length) {
            var h = hits[0].point;
            // 接管法兰自设备表面伸出 0.30 m
            var rp = new THREE.Vector3(h.x + dirs[d][0]*0.30, tryY[k], h.z + dirs[d][1]*0.30);
            _surfCache[key] = rp.clone();
            return rp;
          }
        }
      }
    }

    // ---- 回退：矩形近似（旧算法） ----
    var cx2 = c.x + (p.cx || 0);
    var dx2 = towardX - cx2, dz2 = towardZ - c.z;
    var len2 = Math.sqrt(dx2*dx2 + dz2*dz2);
    if (len2 < 0.01) { dx2 = 1; dz2 = 0; len2 = 1; }
    var ux2 = dx2/len2, uz2 = dz2/len2;
    var tX = Math.abs(ux2) > 1e-4 ? (p.sx / Math.abs(ux2)) : Infinity;
    var tZ = Math.abs(uz2) > 1e-4 ? (p.sz / Math.abs(uz2)) : Infinity;
    var d2 = Math.min(tX, tZ) + 0.35;
    return new THREE.Vector3(cx2 + ux2*d2, p.portY, c.z + uz2*d2);
  }

  // ---------- 画一段直管 ----------
  function seg(p1, p2, r, mat, type) {
    var dir = new THREE.Vector3().subVectors(p2, p1);
    var len = dir.length();
    if (len < 0.15) return;
    var mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
    // 保温后外径
    var outer = r + (type === 'air' ? 0.02 : INSUL);
    var m = new THREE.Mesh(new THREE.CylinderGeometry(outer, outer, len, 14), mat);
    m.position.copy(mid);
    m.lookAt(p2);
    m.rotateX(Math.PI/2);
    m.castShadow = true; m.receiveShadow = true;
    m.userData.isPipe = true;
    scene.add(m);
    segCount++;

    // 两端弯头（球关节）
    var eg = new THREE.SphereGeometry(outer*1.25, 10, 8);
    var e1 = new THREE.Mesh(eg, mat); e1.position.copy(p1); scene.add(e1);
    var e2 = new THREE.Mesh(eg, mat); e2.position.copy(p2); scene.add(e2);

    // 水平段：每隔约 5.5 m 设一个管墩/管卡
    if (Math.abs(p2.y - p1.y) < 0.05) {
      var n = Math.max(1, Math.floor(len / 5.5));
      for (var i = 1; i <= n; i++) {
        var t = i / (n + 1);
        var px = p1.x + (p2.x - p1.x) * t;
        var pz = p1.z + (p2.z - p1.z) * t;
        addPier(scene, concreteMat, steelMat, px, pz, p1.y, outer);
      }
    } else {
      // 立管：底部设一个管墩
      addPier(scene, concreteMat, steelMat, p1.x, p1.z, Math.min(p1.y, p2.y), outer);
    }
  }

  // ---------- 管墩 + 管卡 ----------
  function addPier(sc, cMat, sMat, x, z, pipeY, outer) {
    var top = pipeY - outer;               // 管底标高
    var h = top;
    if (h < 0.18) return;                  // 贴地不设墩
    var pier = new THREE.Mesh(new THREE.BoxGeometry(0.34, h, 0.34), cMat);
    pier.position.set(x, h/2, z);
    pier.castShadow = true; pier.receiveShadow = true;
    sc.add(pier);
    // 钢支架横梁
    var beam = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.06, 0.16), sMat);
    beam.position.set(x, top - 0.03, z);
    sc.add(beam);
    // U 形管卡
    var clamp = new THREE.Mesh(new THREE.TorusGeometry(outer*1.15, 0.025, 6, 14), sMat);
    clamp.rotation.x = Math.PI/2;
    clamp.position.set(x, pipeY, z);
    sc.add(clamp);
    pierCount++;
  }

  // ---------- 闸阀（带手轮），装在起点立管上 ----------
  function addGateValve(p, r, mat) {
    var g = new THREE.Group();
    var outer = r + INSUL;
    var body = new THREE.Mesh(new THREE.CylinderGeometry(outer*1.35, outer*1.35, outer*2.2, 12), mat);
    g.add(body);
    var bonnet = new THREE.Mesh(new THREE.CylinderGeometry(outer*0.75, outer*0.95, outer*1.6, 10), steelMat);
    bonnet.position.y = outer*1.7; g.add(bonnet);
    var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, outer*1.4, 8), steelMat);
    stem.position.y = outer*2.6; g.add(stem);
    var wheel = new THREE.Mesh(new THREE.TorusGeometry(outer*1.15, 0.028, 8, 16), B.makePaint(0xcc3333));
    wheel.rotation.x = Math.PI/2;
    wheel.position.y = outer*3.3; g.add(wheel);
    g.position.copy(p);
    g.traverse(function(o){ if(o.isMesh) o.castShadow = true; });
    scene.add(g);
  }

  // ---------- 色环（介质标识，真实工厂每根管都有） ----------
  function addColorBand(p, outer, color) {
    var band = new THREE.Mesh(
      new THREE.CylinderGeometry(outer*1.12, outer*1.12, 0.16, 14),
      new THREE.MeshStandardMaterial({color: color, roughness: 0.5, metalness: 0.1})
    );
    band.position.copy(p);
    scene.add(band);
  }

  // ============================================================
  //  逐条管线生成：接口 →（立管）→ 管廊水平段 →（立管）→ 接口
  // ============================================================
  PIPE_DEFS.forEach(function(def, idx) {
    var tA = def[0], tB = def[1], r = def[2], color = def[3], type = def[4];
    var cA = centerOf[tA], cB = centerOf[tB];
    if (!cA || !cB) return;

    var mat = pipeMat[type] || pipeMat.liquid;

    // 两端接管口（朝对方方向引出，避免管道穿越设备本体）
    var A = surfacePoint(tA, cB.x, cB.z);
    var Bp = surfacePoint(tB, cA.x, cA.z);

    // 并行管线错开车道，避免所有管道重叠在同一条线上
    var lane = ((idx % 5) - 2) * 0.42;
    // 交替路由：偶数先沿 X 后沿 Z，奇数先沿 Z 后沿 X，减少相互重叠
    var firstX = (idx % 2) === 0;

    // 跨越厂区主干道（x=±22 / z=±40）时抬高到桁架标高
    function crossRoad(x1, z1, x2, z2) {
      var roadX = (Math.min(x1,x2) < -19 && Math.max(x1,x2) > -25) ||
                  (Math.min(x1,x2) <  19 && Math.max(x1,x2) >  25);
      var roadZ = (Math.min(z1,z2) < -37 && Math.max(z1,z2) > -43) ||
                  (Math.min(z1,z2) <  37 && Math.max(z1,z2) >  43);
      return (roadX || roadZ) ? RACK_HIGH : RACK_Y;
    }

    var yR = crossRoad(A.x, A.z, Bp.x, Bp.z);

    // ============================================================
    //  避障选路：生成多套候选路由（车道 + 折线顺序），按
    //  「穿越其他设备本体的采样点数」打分，取最优的一条
    //  ——真实工厂管廊就是这样绕开设备基础的
    // ============================================================
    var LANES   = [0, -0.42, 0.42, -0.84, 0.84, -1.26, 1.26, -2.1, 2.1];  // 横向车道偏移(m)
    var YOFFS   = [0, 0.105, -0.105, 0.21, -0.21];                          // 管廊标高微调(m)
    var DETOURS = [-6, -3, 3, 6, -9, 9, -13, 13];                           // 绕行横向距离(m)
    var PERIM_W = -52, PERIM_E = 46;                                        // 厂区外围管廊坐标
    // 注意：横向偏移(v)只作用于 X/Z 平面；管廊标高另用 yOff 微调，
    //      两者不能混用（否则大绕行量会把管廊标高算到地面以下）
    function makeRoute(kind, v, yOff) {
      var yL = yR + yOff;
      var pts = [A.clone(), new THREE.Vector3(A.x, yL, A.z)];
      if (kind === 'XZ') {          // 先沿 X 再沿 Z（车道偏移）
        pts.push(new THREE.Vector3(Bp.x, yL, A.z));
        pts.push(new THREE.Vector3(Bp.x, yL, Bp.z + v));
      } else if (kind === 'ZX') {   // 先沿 Z 再沿 X
        pts.push(new THREE.Vector3(A.x + v, yL, Bp.z));
        pts.push(new THREE.Vector3(Bp.x, yL, Bp.z));
      } else if (kind === 'ZXZ') {  // Z→X→Z 绕行（横向绕开设备基础）
        var zd = (A.z + Bp.z) / 2 + v;
        pts.push(new THREE.Vector3(A.x, yL, zd));
        pts.push(new THREE.Vector3(Bp.x, yL, zd));
        pts.push(new THREE.Vector3(Bp.x, yL, Bp.z));
      } else if (kind === 'PERIMW' || kind === 'PERIME') {
        // 外围公用管廊：长距离跨工段管线沿厂区围墙内侧敷设（真实工厂的公用主管廊做法）
        var px = (kind === 'PERIMW') ? PERIM_W : PERIM_E;
        pts.push(new THREE.Vector3(px, yL, A.z));
        pts.push(new THREE.Vector3(px, yL, Bp.z + v));
        pts.push(new THREE.Vector3(Bp.x, yL, Bp.z + v));
        pts.push(new THREE.Vector3(Bp.x, yL, Bp.z));
      } else {                      // XZX 绕行
        var xd = (A.x + Bp.x) / 2 + v;
        pts.push(new THREE.Vector3(xd, yL, A.z));
        pts.push(new THREE.Vector3(xd, yL, Bp.z));
        pts.push(new THREE.Vector3(Bp.x, yL, Bp.z));
      }
      pts.push(new THREE.Vector3(Bp.x, yL, Bp.z));   // 终点立管底
      pts.push(Bp.clone());
      return pts;
    }
    function routeCost(pts) {
      var hits = 0, len = 0;
      for (var j = 0; j < pts.length - 1; j++) {
        var a = pts[j], b = pts[j+1];
        var L = a.distanceTo(b);
        len += L;
        if (Math.abs(a.y - b.y) > 0.05) continue;      // 只查水平管廊段
        var n = Math.max(1, Math.floor(L / 1.2));
        for (var i = 1; i < n; i++) {
          var p = new THREE.Vector3().lerpVectors(a, b, i / n);
          if (pointInsideEquip(p, tA, tB)) hits++;
        }
      }
      return hits * 1000 + len;                        // 穿越优先否决，其次选短
    }

    var pairKey = tA + '>' + tB;
    _pairCount[pairKey] = (_pairCount[pairKey] || 0) + 1;
    var laneBias = (_pairCount[pairKey] - 1) % 3;      // 同起终点的多条管线错开车道

    var best = null, bestScore = Infinity;
    function consider(cand) {
      var sc = routeCost(cand);
      if (sc < bestScore) { bestScore = sc; best = cand; }
    }
    YOFFS.forEach(function(yo){
      LANES.forEach(function(v){
        consider(makeRoute('XZ', v, yo));
        consider(makeRoute('ZX', v, yo));
      });
    });
    // 外围公用管廊方案：常规折线绕不开时启用（成本函数会自然比较"绕远"与"穿越设备"）
    if (bestScore >= 1000) {
      YOFFS.forEach(function(yo){
        DETOURS.forEach(function(v){
          consider(makeRoute('ZXZ', v, yo));
          consider(makeRoute('XZX', v, yo));
        });
        consider(makeRoute('PERIMW', 0, yo));
        consider(makeRoute('PERIME', 0, yo));
        [-10, -5, 5, 10, -16, 16].forEach(function(v){
          consider(makeRoute('PERIMW', v, yo));
          consider(makeRoute('PERIME', v, yo));
        });
      });
    }

    var route = best;
    routeAvoid = routeAvoid + ((bestScore >= 1000) ? 1 : 0);

    // —— 起点：设备接口 → 降到管廊标高 ——
    addGateValve(new THREE.Vector3(A.x, yR + 0.35, A.z), r, mat);

    // —— 逐段成管：首尾为立管，中间为管廊水平段（遍历全部折点，杜绝中间断口） ——
    var bandDone = false;
    for (var sj = 0; sj < route.length - 1; sj++) {
      var p1 = route[sj], p2 = route[sj+1];
      seg(p1, p2, r, mat, type);
      if (!bandDone && Math.abs(p1.y - p2.y) < 0.05 && p1.distanceTo(p2) > 2.5) {
        addColorBand(new THREE.Vector3((p1.x+p2.x)/2, p1.y, (p1.z+p2.z)/2), r + INSUL, color);
        bandDone = true;
      }
    }

    // 存路径：idx 对应 PIPE_DEFS 下标
    PIPE_ROUTES[idx] = route;
    route.pipeR = r;
    route.pipeType = type;
    route.fromTag = tA;
    route.toTag = tB;
  });

  console.log('[管线] 生成 ' + PIPE_DEFS.length + ' 条，管段 ' + segCount + ' 节，管墩 ' + pierCount +
              ' 个' + (routeAvoid ? '，仍有 ' + routeAvoid + ' 条无法完全避开设备' : '，全部避开设备本体'));
}

<script>
/* ===== 内联: lib/instrument_builders.js ===== */
// ============================================================
// 3D 仪表模型构建器 — 按真实工业仪表的安装形式与外形构建
// 依赖: THREE, INSTRUMENTS, INSTR_META, CONTROL_LOOPS, INTERLOCKS
//       PIPE_ROUTES（管道路径，供管道上仪表取点）
// 加载顺序: lib/equip_builders.js → lib/pipes.js → lib/instrument_builders.js
// ============================================================
// ------------------------------------------------------------
//  可视化放大说明
//  真实就地压力表表盘 ⌀100~150 mm，在 120 m 厂区里远观不可见。
//  故表盘按 3:1 放大到 ⌀0.42 m，支架/引压管按同比例配套。
//  外形比例（表盘:表壳:支架:引压管）与真实仪表一致。
// ------------------------------------------------------------
var INSTR_SCALE = 1.0;
var GAUGE_R = 0.21;          // 表盘半径（放大后）

// ============================================================
//  设备「仪表挂载盒」——只覆盖设备主体，不含烟囱/管架等附属件
// ============================================================
var MOUNT_BOX = {
  'K-202': {sx: 2.20, sz: 9.00, h: 4.20},
  'A-701': {sx: 2.20, sz: 2.20, h: 8.00},
  'A-702': {sx: 1.70, sz: 1.60, h: 4.60},
  'B-808': {sx: 3.20, sz: 2.20, h: 3.40},
  'K-601': {sx: 3.20, sz: 1.90, h: 3.60},
  'C-704': {sx: 2.60, sz: 2.40, h: 5.40},
  'S-801': {sx: 3.60, sz: 2.30, h: 5.00},
  'S-802': {sx: 2.80, sz: 2.30, h: 6.00},
  'T-106': {sx: 5.00, sz: 5.00, h: 2.60},
  'T-303': {sx: 4.30, sz: 4.30, h: 3.00},
  'T-502': {sx: 4.00, sz: 4.00, h: 2.60},
  'R-301': {sx: 2.80, sz: 2.70, h: 4.60},
  'R-302': {sx: 2.20, sz: 2.20, h: 4.00},
  'R-303': {sx: 2.20, sz: 2.20, h: 4.00},
  'E-401': {sx: 5.20, sz: 1.70, h: 3.40},
  'P-303': {sx: 3.60, sz: 1.30, h: 2.20},
  'P-503': {sx: 3.00, sz: 1.10, h: 2.10},
  'V-101': {sx: 4.50, sz: 4.50, h: 3.00},
  'B-901': {sx: 3.00, sz: 3.00, h: 1.50},
  'U-804': {sx: 3.60, sz: 1.50, h: 3.20}
};

var INSTRUMENT_BUILDERS = {
  _box: function(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); },
  _cyl: function(r,r2,h,mat,seg){ return new THREE.Mesh(new THREE.CylinderGeometry(r,r2,h,seg||16),mat); },
  _sph: function(r,mat){ return new THREE.Mesh(new THREE.SphereGeometry(r,12,10),mat); },
  _tor: function(r,tube,mat){ return new THREE.Mesh(new THREE.TorusGeometry(r,tube,8,20),mat); },

  makeMetal: function(c){ return new THREE.MeshStandardMaterial({color:c!==undefined?c:0x9aa5b1, roughness:0.35, metalness:0.7}); },
  makeCase:  function(c){ return new THREE.MeshStandardMaterial({color:c!==undefined?c:0x2f3f52, roughness:0.6, metalness:0.25}); },
  makeDial:  function(){ return new THREE.MeshStandardMaterial({color:0xf2f4f6, roughness:0.25, metalness:0.1}); },
  makeGlow:  function(c){ return new THREE.MeshStandardMaterial({color:c, emissive:c, emissiveIntensity:0.85, roughness:0.4}); },

  _colorOf: function(type){
    var hex = (INSTR_META[type] && INSTR_META[type].color) || '#8899aa';
    return parseInt(hex.replace('#','0x'), 16);
  },

  // ============================================================
  //  量程解析：'0~1200 ℃' → [0,1200]；'-500~0 Pa' → [-500,0]
  // ============================================================
  parseRange: function(instr){
    if (instr._rng) return instr._rng;
    var mn = 0, mx = 100;
    if (typeof instr.range === 'string') {
      var m = instr.range.match(/(-?[\d.]+)\s*[~～-]\s*(-?[\d.]+)/);
      if (m) { mn = parseFloat(m[1]); mx = parseFloat(m[2]); }
    }
    instr._rng = [mn, mx];
    return instr._rng;
  },

  // ============================================================
  //  表盘纹理（Canvas 绘制）：刻度 + 高低报警区 + 指针 + 数值
  //  这才是"现场能看到的仪表盘"，用户能直接读出当前工况
  // ============================================================
  makeGaugeTexture: function(instr){
    var S = 256, C = S/2;
    var canvas = document.createElement('canvas');
    canvas.width = S; canvas.height = S;
    var ctx = canvas.getContext('2d');
    var R = C - 10;

    // 盘面（白）
    ctx.fillStyle = '#f4f6f8';
    ctx.beginPath(); ctx.arc(C, C, R, 0, Math.PI*2); ctx.fill();

    var rng = this.parseRange(instr);
    var mn = rng[0], mx = rng[1];
    function normOf(v){ return Math.max(0, Math.min(1, (v - mn) / (mx - mn || 1))); }
    // 角度：0 位在左下(225°)，满量程在右下(135°)，顺时针扫过 270°
    function angOf(n){ return (225 + n * 270) * Math.PI / 180; }
    // canvas 弧度（0 → +X 方向），表盘 0° 指向 12 点
    function radOf(n){ return angOf(n) - Math.PI/2; }

    // 报警区（外圈色带）：低低-低 黄，高-高高 红
    function arcBand(n0, n1, color, w){
      if (n1 <= n0) return;
      ctx.strokeStyle = color; ctx.lineWidth = w;
      ctx.beginPath(); ctx.arc(C, C, R - 8, radOf(n0), radOf(n1)); ctx.stroke();
    }
    if (instr.ll !== undefined) arcBand(normOf(instr.ll === undefined ? mn : instr.ll), normOf(instr.l !== undefined ? instr.l : mn), '#e8a33d', 7);
    if (instr.l  !== undefined && instr.ll !== undefined) arcBand(normOf(instr.ll), normOf(instr.l), '#e8a33d', 7);
    if (instr.h  !== undefined) arcBand(normOf(instr.h), normOf(instr.hh !== undefined ? instr.hh : mx), '#d64545', 7);

    // 刻度：20 大格 + 每格 5 小格
    ctx.strokeStyle = '#2b3440';
    for (var i = 0; i <= 20; i++){
      var n = i/20, a = radOf(n);
      var big = (i % 5 === 0);
      ctx.lineWidth = big ? 3 : 1.5;
      var r0 = R - (big ? 22 : 14), r1 = R - 8;
      ctx.beginPath();
      ctx.moveTo(C + Math.cos(a)*r0, C + Math.sin(a)*r0);
      ctx.lineTo(C + Math.cos(a)*r1, C + Math.sin(a)*r1);
      ctx.stroke();
    }
    // 表盘外圈
    ctx.strokeStyle = '#7b8794'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(C, C, R - 2, 0, Math.PI*2); ctx.stroke();

    // 指针（当前值）
    var pv = (instr.faultPv !== undefined && instr._showFault) ? instr.faultPv : instr.pv;
    var np = normOf(pv);
    var ap = radOf(np);
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(C - Math.cos(ap)*12, C - Math.sin(ap)*12);
    ctx.lineTo(C + Math.cos(ap)*(R - 26), C + Math.sin(ap)*(R - 26));
    ctx.stroke();
    // 中心轴
    ctx.fillStyle = '#2b3440';
    ctx.beginPath(); ctx.arc(C, C, 8, 0, Math.PI*2); ctx.fill();

    // 数值显示窗
    ctx.fillStyle = '#101c30';
    ctx.fillRect(C - 46, C + 24, 92, 34);
    ctx.fillStyle = '#7fe3a0';
    ctx.font = 'bold 22px Consolas, "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(pv), C, C + 34);
    ctx.fillStyle = '#9fb2c7';
    ctx.font = '13px Consolas, monospace';
    ctx.fillText(String(instr.unit || ''), C, C + 52);

    // 位号
    ctx.fillStyle = '#2b3440';
    ctx.font = 'bold 17px Consolas, monospace';
    ctx.fillText(instr.tag, C, C - 34);

    var tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    return tex;
  },

  // ============================================================
  //  就地指示仪表（现场仪表，带可见表盘）
  //  真实形式：PI 压力表 / TI 双金属温度计 / LI 玻璃板液位计 / FI 转子流量计
  //  mount: 'post'(落地支架) | 'wall'(设备壁支架) | 'pipe'(管道取压)
  // ============================================================
  buildLocalGauge: function(instr, mount){
    var g = new THREE.Group();
    g.name = 'INST_' + instr.tag;
    var mm = this.makeMetal();
    var accent = this._colorOf(instr.type);
    var caseMat = this.makeCase(accent);

    // —— 表壳（金属圆环 + 壳体）——
    var shell = this._cyl(GAUGE_R*1.10, GAUGE_R*1.10, 0.07, caseMat, 28);
    shell.rotation.x = Math.PI/2;
    g.add(shell);
    var bezel = this._tor(GAUGE_R*1.10, 0.022, mm);
    g.add(bezel);

    // —— 表盘（Canvas 贴图，带刻度与指针）——
    var faceMat;
    try {
      faceMat = new THREE.MeshStandardMaterial({
        map: this.makeGaugeTexture(instr), roughness: 0.35, metalness: 0.05
      });
    } catch (e) {
      faceMat = this.makeDial();
    }
    var face = new THREE.Mesh(new THREE.CircleGeometry(GAUGE_R, 32), faceMat);
    face.position.z = 0.037;
    g.add(face);
    g.userData.faceMat = faceMat;

    // —— 安装附件（这是"不悬空"的关键）——
    if (mount === 'pipe') {
      // 管道取压：表头 → 根部阀 → 引压短管 → 管顶
      var rootValve = this._cyl(0.035, 0.035, 0.09, mm, 10);
      rootValve.position.y = -0.10; g.add(rootValve);
      var hv = this._box(0.10, 0.05, 0.03, this.makeCase(0xcc3333));
      hv.position.y = -0.10; g.add(hv);
      var impulse = this._cyl(0.022, 0.022, 0.20, mm, 8);
      impulse.position.y = -0.24; g.add(impulse);
      var weld = this._cyl(0.06, 0.06, 0.05, mm, 12);
      weld.position.y = -0.36; g.add(weld);
    } else if (mount === 'post') {
      // 落地支架：立柱 + 底座（气体探测器/火焰检测器的真实安装形式）
      // 立柱从表头一直伸到地面（表头离地 1.55 m → 柱长 1.42 + 底座落地）
      var post = this._cyl(0.045, 0.045, 1.42, mm, 10);
      post.position.y = -0.81; g.add(post);
      var plate = this._box(0.24, 0.04, 0.24, mm);
      plate.position.y = -1.53; g.add(plate);
      var arm = this._cyl(0.03, 0.03, 0.22, mm, 8);
      arm.rotation.z = Math.PI/2;
      arm.position.set(-0.10, -0.16, 0); g.add(arm);
    } else {
      // 设备壁支架：引压管 + 根部阀 + 法兰（温度/压力最典型）
      // 注意：表盘经 lookAt 后 +Z 朝外（背离设备），附件必须沿 -Z 指向设备本体
      var neck = this._cyl(0.028, 0.028, 0.22, mm, 8);

      rv.rotation.x = Math.PI/2;
      rv.position.z = -0.38; g.add(rv);

      fl.rotation.x = Math.PI/2;
      fl.position.z = -0.445; g.add(fl);

    try {
      var tag = this.makeTagSprite(instr);
      tag.position.set(0, -GAUGE_R - 0.14, 0);
      tag.userData.isTag = true;
      g.add(tag);
    } catch (e) {}

    g.userData = {instr: instr, isInstrument: true, tag: instr.tag, mount: mount, faceMat: faceMat};
    g.traverse(function(o){ if(o.isMesh){ o.castShadow = true; } });
    return g;
  },

  // ============================================================
  //  变送器（远传型，无大表盘；本体小，带引压管与根部阀）
  //  真实形式：1151/3051 型压力变送器、温度变送器、雷达液位计
  // ============================================================
  buildTransmitter: function(instr, mount){
    var g = new THREE.Group();
    g.name = 'INST_' + instr.tag;
    var mm = this.makeMetal();
    var accent = this._colorOf(instr.type);
    var caseMat = this.makeCase(accent);

    var t = instr.type;
    if (t === 'L') {
      // 雷达/超声波液位计：法兰 + 喇叭天线朝下，装在设备顶部
      var flange = this._cyl(0.11, 0.11, 0.03, mm, 18);
      flange.position.y = -0.06; g.add(flange);
      var horn = this._cyl(0.05, 0.10, 0.12, mm, 18);
