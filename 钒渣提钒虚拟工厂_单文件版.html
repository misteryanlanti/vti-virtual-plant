      var lbody = this._box(0.17, 0.16, 0.13, caseMat);
      lbody.position.y = 0.06; g.add(lbody);
      var lface = this._box(0.10, 0.075, 0.01, this.makeDial());
      lface.position.set(0, 0.07, 0.07); g.add(lface);
    } else if (t === 'T') {
      // 温度变送器：热电偶套管（插入设备）+ 接线盒 + 变送模块
      // 套管沿 -Z 插入设备本体（lookAt 后 -Z 指向设备）
      var tube = this._cyl(0.028, 0.028, 0.42, mm, 10);
      tube.rotation.x = Math.PI/2;
      tube.position.z = -0.34; g.add(tube);
      var neckT = this._cyl(0.048, 0.048, 0.14, mm, 12);
      neckT.position.y = 0.10; g.add(neckT);
      var headT = this._cyl(0.085, 0.085, 0.10, caseMat, 18);
      headT.position.y = 0.21; g.add(headT);
      var lidT = this._cyl(0.088, 0.088, 0.02, mm, 18);
      lidT.position.y = 0.27; g.add(lidT);
    } else {
      // 通用变送器（压力/流量/分析）：引压管 + 根部阀 + 圆形本体
      // 引压管沿 -Z 指向设备
      var imp = this._cyl(0.022, 0.022, 0.26, mm, 8);
      imp.rotation.x = Math.PI/2;
      imp.position.z = -0.26; g.add(imp);
      var rv2 = this._cyl(0.040, 0.040, 0.08, mm, 10);
      rv2.rotation.x = Math.PI/2;
      rv2.position.z = -0.38; g.add(rv2);
      var body = this._cyl(0.10, 0.10, 0.13, mm, 18);
      body.rotation.z = Math.PI/2; g.add(body);
      var cover = this._cyl(0.095, 0.095, 0.02, caseMat, 18);
      cover.rotation.z = Math.PI/2;
      cover.position.x = 0.075; g.add(cover);
      var lcd = this._box(0.05, 0.035, 0.01, this.makeDial());
      lcd.position.set(0.095, 0, 0); g.add(lcd);
      var conduit = this._cyl(0.022, 0.022, 0.14, mm, 8);
      conduit.position.set(0, 0.12, 0); g.add(conduit);
    }

    try {
      var tg = this.makeTagSprite(instr);
      tg.position.set(0, 0.34, 0);
      tg.userData.isTag = true;
      g.add(tg);
    } catch (e) {}

    g.userData = {instr: instr, isInstrument: true, tag: instr.tag, mount: mount};
    g.traverse(function(o){ if(o.isMesh){ o.castShadow = true; } });
    return g;
  },

  // ============================================================
  //  分析仪（箱式机柜 + 显示屏，如 pH 计/烟气分析仪/浓度计）
  //  真实形式：落地或挂墙的分析小屋/分析柜，带取样管
  // ============================================================
  buildAnalyzer: function(instr){
    var g = new THREE.Group();
    g.name = 'INST_' + instr.tag;
    var mm = this.makeMetal();
    var accent = this._colorOf(instr.type);
    var caseMat = this.makeCase(accent);

    // 分析柜（落地，高 1.4 m）
    var cab = this._box(0.46, 1.10, 0.34, caseMat);
    cab.position.y = 0.55; g.add(cab);
    // 显示屏（自发光，远观可辨）
    var screen = this._box(0.34, 0.24, 0.02, this.makeGlow(0x2288cc));
    screen.position.set(0, 0.86, 0.175); g.add(screen);
    // 柜门分隔
    var door = this._box(0.40, 0.40, 0.01, this.makeMetal(0x3a4654));
    door.position.set(0, 0.36, 0.175); g.add(door);
    // 底座
    var plinth = this._box(0.50, 0.10, 0.38, mm);
    plinth.position.y = 0.05; g.add(plinth);
    // 取样管（从设备引来，接入柜体）—— 沿 -Z 指向设备
    var sample = this._cyl(0.025, 0.025, 0.55, mm, 8);
    sample.rotation.x = Math.PI/2;
    sample.position.set(0, 0.75, -0.50); g.add(sample);
    // 探头（插入工艺介质）
    var probe = this._cyl(0.035, 0.025, 0.30, mm, 10);
    probe.rotation.x = Math.PI/2;
    probe.position.set(0, 0.75, -0.80); g.add(probe);
    var tip = this._sph(0.035, this.makeGlow(0x33ccff));
    tip.position.set(0, 0.75, -0.96); g.add(tip);

    try {
      var ta = this.makeTagSprite(instr);
      ta.position.set(0, 1.32, 0);
      ta.userData.isTag = true;
      g.add(ta);
    } catch (e) {}

    g.userData = {instr: instr, isInstrument: true, tag: instr.tag, mount: 'post'};
    g.traverse(function(o){ if(o.isMesh){ o.castShadow = true; } });
    return g;
  },

  // ============================================================
  //  按位号判定仪表形式（HG/T 20505）
  //   第二位 I → 就地指示（带表盘）  T → 变送器   E → 检测元件
  // ============================================================
  isLocalIndicating: function(instr){
    var tag = instr.tag;
    var fn = tag.length >= 2 ? tag.charAt(1) : 'I';
    return fn === 'I';
  },
  isTransmitting: function(instr){
    var tag = instr.tag;
    var fn = tag.length >= 2 ? tag.charAt(1) : 'I';
    return fn === 'T';
  },

  build: function(instr, mount){
    if (instr.type === 'A' && this.isLocalIndicating(instr)) return this.buildAnalyzer(instr);
    if (this.isLocalIndicating(instr)) return this.buildLocalGauge(instr, mount || 'wall');
    return this.buildTransmitter(instr, mount || 'wall');
  },

  // ============================================================
  //  位号浮标：Canvas 贴图 Sprite
  // ============================================================
  makeTagSprite: function(instr){
    var canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    var ctx = canvas.getContext('2d');
    var hex = (INSTR_META[instr.type] && INSTR_META[instr.type].color) || '#8899aa';
    ctx.fillStyle = 'rgba(8,18,38,0.88)';
    ctx.fillRect(0, 0, 256, 64);
    ctx.fillStyle = hex;
    ctx.fillRect(0, 0, 12, 64);
    ctx.strokeStyle = hex; ctx.lineWidth = 3;
    ctx.strokeRect(1.5, 1.5, 253, 61);
    ctx.fillStyle = '#eaf4ff';
    ctx.font = 'bold 30px Consolas, "Courier New", monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText(instr.tag, 22, 34);
    var tex = new THREE.CanvasTexture(canvas);
    var mat = new THREE.SpriteMaterial({map: tex, transparent: true, depthWrite: false});
    var sp = new THREE.Sprite(mat);
    sp.scale.set(0.62, 0.155, 1);
    return sp;
  },

  // ============================================================
  //  管道取点（带方向）：返回设备相连管段上的点 + 该段水平方向单位向量
  //  用于流量计/调节阀/SIS切断阀按真实做法夹装在管道上
  // ============================================================
  pipePointEx: function(equipTag, seq){
    if (typeof PIPE_ROUTES === 'undefined') return null;
    var segs = [];
    for (var i = 0; i < PIPE_ROUTES.length; i++){
      var r = PIPE_ROUTES[i];
      if (!r || r.length < 3) continue;
      if (r.fromTag !== equipTag && r.toTag !== equipTag) continue;
      // 收集所有水平管廊段（y 基本相同的相邻点）
      for (var j = 0; j < r.length - 1; j++){
        var a = r[j], b = r[j+1];
        if (Math.abs(a.y - b.y) > 0.05) continue;
        var len = Math.sqrt((b.x-a.x)*(b.x-a.x) + (b.z-a.z)*(b.z-a.z));
        if (len < 1.6) continue;
        segs.push({a: a, b: b, len: len});
      }
    }
    if (!segs.length) return null;
    var sg = segs[seq % segs.length];          // 段数不够时循环复用
    var t = 0.30 + ((seq * 0.19) % 0.45);      // 同段内错开阀门/仪表
    return {
      p: new THREE.Vector3(sg.a.x + (sg.b.x-sg.a.x)*t, sg.a.y, sg.a.z + (sg.b.z-sg.a.z)*t),
      dx: (sg.b.x-sg.a.x)/sg.len, dz: (sg.b.z-sg.a.z)/sg.len
    };
  },

  // 兼容旧接口：只取点
  pipePoint: function(equipTag, seq){
    var ex = this.pipePointEx(equipTag, seq);
    return ex ? ex.p : null;
  },

  // ============================================================
  //  射线实测设备表面：从设备外 40m 处沿水平方向射向设备中心
  //  返回真实表面命中点（适配圆柱窑体、球罐、框架等任意外形）
  // ============================================================
  surfaceHit: function(host, center, dirX, dirZ, y){
    if (!host) return null;
    var origin = new THREE.Vector3(center.x + dirX*40, y, center.z + dirZ*40);
    var ray = new THREE.Raycaster(origin, new THREE.Vector3(-dirX, 0, -dirZ), 0.1, 80);
    var hits = ray.intersectObject(host, true);
    return hits.length ? hits[0].point : null;
  },

  // ============================================================
  //  挂载位置计算：贴到设备主体表面
  // ============================================================
  calcMountPos: function(instr, box, idx, sameTypeCount){
    var size = box.getSize(new THREE.Vector3());
    var center = box.getCenter(new THREE.Vector3());
    var mb = MOUNT_BOX[instr.equip];
    var sx = mb ? mb.sx : Math.min(size.x / 2, 6.0);
    var sz = mb ? mb.sz : Math.min(size.z / 2, 6.0);
    var H  = mb ? mb.h  : Math.min(size.y, 5.0);
    if (H < 1.2) H = 1.2;

    var ang;
    if (sameTypeCount > 1) {
      ang = (idx / sameTypeCount) * Math.PI * 2 + (instr.type.charCodeAt(0) % 7) * 0.35;
    } else {
      ang = ((instr.tag.charCodeAt(instr.tag.length-1) % 8) / 8) * Math.PI * 2;
    }

    var t = instr.type;
    var yFrac;
    if (t === 'L')       yFrac = 1.0;    // 液位：装顶部
    else if (t === 'F')  yFrac = 0.35;
    else if (t === 'P')  yFrac = 0.42;   // 压力：引压点在中部（便于观察）
    else if (t === 'T')  yFrac = 0.58;
    else if (t === 'A')  yFrac = 0.60;
    else if (t === 'S')  yFrac = 0.80;
    else if (t === 'W')  yFrac = 0.20;
    else if (t === 'I' || t === 'E') yFrac = 0.50;
    else if (t === 'G')  yFrac = 0.45;
    else if (t === 'B')  yFrac = 0.50;
    else                 yFrac = 0.64;
    var y = Math.max(1.35, H * yFrac);   // 表盘中心不低于 1.35 m（便于现场读数）
    if (t === 'G') y = 1.55;             // 气体探测器固定在呼吸带高度

    var ux = Math.cos(ang), uz = Math.sin(ang);
    var dist = 1 / Math.sqrt((ux/sx)*(ux/sx) + (uz/sz)*(uz/sz));
    if (dist > 3.5) dist = 3.5;
    var r = dist + 0.28;

    return new THREE.Vector3(center.x + Math.cos(ang)*r, y, center.z + Math.sin(ang)*r);
  },

  // ============================================================
  //  主入口：为所有设备挂载仪表 + 控制阀
  // ============================================================
  mountAll: function(scene, equipMeshes){
    var self = this;
    var created = new Map();
    var valveMap = new Map();

    scene.updateMatrixWorld(true);   // 射线检测前必须更新世界矩阵

    var byEquip = {};
    INSTRUMENTS.forEach(function(m){
      (byEquip[m.equip] = byEquip[m.equip] || []).push(m);
    });

    Object.keys(byEquip).forEach(function(eqTag){
      var host = equipMeshes.get(eqTag);
      if (!host) return;
      var box = new THREE.Box3().setFromObject(host);
      var c = box.getCenter(new THREE.Vector3());
      var sizeY = box.getSize(new THREE.Vector3()).y;
      var list = byEquip[eqTag];

      var typeIdx = {};
      list.forEach(function(m){ typeIdx[m.type] = (typeIdx[m.type]||0)+1; });
      var seen = {};
      var flowSeq = 0;   // 该设备上第几个流量计（用于在管道上错开位置）

      list.forEach(function(m){
        seen[m.type] = (seen[m.type] || 0);
        var mount = 'wall';
        var pos = null;
        var outX = null, outZ = null;   // 安装朝向（设备表面外法向），供 lookAt 使用
        var isAnalyzer = (m.type === 'A' && self.isLocalIndicating(m));
        var isPost = (m.type === 'G' || m.type === 'B');

        // ① 流量计：按真实做法夹装在管道上（取靠近本设备的一段水平管廊）
        //    若取到的管段离设备太远（跨工段长管线），退回设备壁安装，避免"仪表飘在半路"
        if (m.type === 'F') {
          var pp = self.pipePoint(eqTag, flowSeq);
          if (pp) {
            var dc = Math.sqrt((pp.x - c.x)*(pp.x - c.x) + (pp.z - c.z)*(pp.z - c.z));
            // 管廊本就敷设在设备之间的通道上，12 m 内均属该设备的正常取压范围
            if (dc <= 12.0) {
              pos = pp.clone();
              pos.y += 0.34;        // 表头在管顶上方（真实：管顶取压 + 表头抬高便于读数）
              mount = 'pipe';
            }
          }
        }
        // ② 气体探测器 / 火焰检测器：落地支架安装（真实：立柱 + 底座）
        if (!pos && isPost) mount = 'post';

        // ③ 通用定位：射线实测设备表面，安装件精确贴到本体上
        if (!pos) {
          var ang;
          if (typeIdx[m.type] > 1) {
            ang = (seen[m.type] / typeIdx[m.type]) * Math.PI * 2 + (m.type.charCodeAt(0) % 7) * 0.35;
          } else {
            ang = ((m.tag.charCodeAt(m.tag.length-1) % 8) / 8) * Math.PI * 2;
          }
          var ux = Math.cos(ang), uz = Math.sin(ang);
          var mb = MOUNT_BOX[m.equip];
          var sx = mb ? mb.sx : Math.min(box.getSize(new THREE.Vector3()).x / 2, 6.0);
          var sz = mb ? mb.sz : Math.min(box.getSize(new THREE.Vector3()).z / 2, 6.0);
          var H  = mb ? mb.h  : Math.min(sizeY, 5.0);
          if (H < 1.2) H = 1.2;

          var t = m.type;
          var yFrac;
          if (t === 'L')       yFrac = 1.0;
          else if (t === 'F')  yFrac = 0.35;
          else if (t === 'P')  yFrac = 0.42;
          else if (t === 'T')  yFrac = 0.58;
          else if (t === 'A')  yFrac = 0.60;
          else if (t === 'S')  yFrac = 0.80;
          else if (t === 'W')  yFrac = 0.20;
          else if (t === 'I' || t === 'E') yFrac = 0.50;
          else if (t === 'G')  yFrac = 0.45;
          else if (t === 'B')  yFrac = 0.50;
          else                 yFrac = 0.64;
          var y = Math.max(1.35, H * yFrac);
          if (t === 'G') y = 1.55;

          if (isAnalyzer) {
            // 分析柜落地，探头在 0.75 m 高度插入设备
            var hitA = self.surfaceHit(host, c, ux, uz, 0.75);
            if (hitA) {
              pos = new THREE.Vector3(hitA.x + ux*0.90, 0, hitA.z + uz*0.90);
              outX = ux; outZ = uz;
            } else {
              pos = self.calcMountPos(m, box, seen[m.type], typeIdx[m.type]);
              pos.y = 0;
            }
            mount = 'analyzer';
          } else if (mount === 'post') {
            // 探测器立柱：表头 1.55 m，柱脚落地
            var hitP = self.surfaceHit(host, c, ux, uz, 1.55);
            if (hitP) {
              pos = new THREE.Vector3(hitP.x + ux*0.55, 1.55, hitP.z + uz*0.55);
              outX = ux; outZ = uz;
            } else {
              pos = self.calcMountPos(m, box, seen[m.type], typeIdx[m.type]);
              pos.y = 1.55;
            }
          } else if (t === 'L') {
            // 液位计：从设备顶上方垂直向下射线，法兰落在真实顶板上
            var rin = 0.45 * Math.min(sx, sz);
            var origin = new THREE.Vector3(c.x + ux*rin, y + 15, c.z + uz*rin);
            var rayD = new THREE.Raycaster(origin, new THREE.Vector3(0,-1,0), 0.1, 40);
            var hitsD = rayD.intersectObject(host, true);
            if (hitsD.length) {
              pos = new THREE.Vector3(hitsD[0].point.x, hitsD[0].point.y + 0.08, hitsD[0].point.z);
              outX = ux; outZ = uz;
            } else {
              pos = self.calcMountPos(m, box, seen[m.type], typeIdx[m.type]);
            }
          } else {
            // 壁挂仪表：水平射线打在设备真实表面上，安装件末端贴壁
            var offset = self.isLocalIndicating(m) ? 0.44 : 0.40;
            // 高度序列：期望高度 → 收进设备真实包围盒 → 包围盒中部/上部
            var yLo = box.min.y + 0.5;
            var yHi = Math.max(box.min.y + 0.9, box.max.y - 0.5);
            var yc = Math.max(yLo, Math.min(y, yHi));
            var tryY = [y, yc, (box.min.y + box.max.y) / 2, yHi];
            // 方向序列：期望方位 → 轴向兜底（细长设备如回转窑，沿轴向的射线打不到壳体）
            var dirs = [[ux, uz], [ux >= 0 ? 1 : -1, 0], [0, uz >= 0 ? 1 : -1]];
            for (var d = 0; d < dirs.length && !pos; d++) {
              for (var k = 0; k < tryY.length && !pos; k++) {
                var hitW = self.surfaceHit(host, c, dirs[d][0], dirs[d][1], tryY[k]);
                if (hitW) {
                  pos = new THREE.Vector3(hitW.x + dirs[d][0]*offset, tryY[k], hitW.z + dirs[d][1]*offset);
                  outX = dirs[d][0]; outZ = dirs[d][1];
                }
              }
            }
            if (!pos) pos = self.calcMountPos(m, box, seen[m.type], typeIdx[m.type]);
          }
        }
        if (m.type === 'F' && mount === 'pipe') flowSeq++;

        var g = self.build(m, mount === 'analyzer' ? 'post' : mount);

        // 落地支架/分析柜：表头位置按安装形式设定
        if (mount === 'analyzer') {
          g.position.set(pos.x, 0, pos.z);          // 柜体落地
        } else {
          g.position.copy(pos);
        }

        // 表盘朝向设备外侧（+Z 为表盘法向，lookAt 使 +Z 指向目标）
        // 注意：必须用放置时的真实射线方向（outX/outZ），
        // 设备包围盒中心≠本体中心（如回转窑），用 pos-c 会导致朝向反转、法兰背向设备
        var ox, oz;
        if (outX !== null) { ox = outX; oz = outZ; }
        else { ox = pos.x - c.x; oz = pos.z - c.z; }
        var ol = Math.sqrt(ox*ox + oz*oz);
        if (ol < 0.01) { ox = 1; oz = 0; ol = 1; }
        g.lookAt(new THREE.Vector3(pos.x + ox/ol*4, g.position.y, pos.z + oz/ol*4));
        // 液位计天线必须朝下，不能跟着 lookAt 转
        if (m.type === 'L') { g.rotation.set(0, g.rotation.y, 0); }

        g.userData.hostEquip = eqTag;
        scene.add(g);
        created.set(m.tag, {group: g, instr: m, host: eqTag});
        seen[m.type]++;
      });

      // 控制阀（调节阀）：夹装在与本设备相连的管道上（真实 inline 安装）
      var vi = 0;
      CONTROL_LOOPS.forEach(function(lp){
        if (lp.equip !== eqTag) return;
        var v = self.buildValve(lp, 'control');
        v.scale.setScalar(2.2);
        var pe = self.pipePointEx(eqTag, vi);
        if (pe) {
          v.position.copy(pe.p);
          v.rotation.y = Math.atan2(-pe.dz, pe.dx);   // 阀体轴线对齐管段方向
        } else {
          // 无管段可挂（极少见）：放在设备旁并加落地支架
          var mb = MOUNT_BOX[eqTag];
          var halfX = mb ? mb.sx : Math.min(box.getSize(new THREE.Vector3()).x/2, 4.0);
          var vy = 1.05;
          v.position.set(c.x + halfX + 0.75, vy, c.z + 0.55 + vi * 1.0);
          var ped = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, vy, 8), self.makeMetal());
          ped.position.set(v.position.x, vy/2, v.position.z);
          scene.add(ped);
        }
        scene.add(v);
        valveMap.set(lp.tag, {group: v, loop: lp});
        vi++;
      });
    });

    // SIS 切断阀（红色执行机构）：同样夹装在设备相连管道上
    var sisSeq = {};
    INTERLOCKS.forEach(function(ilk){
      var host = equipMeshes.get(ilk.equip);
      if (!host) return;
      var box = new THREE.Box3().setFromObject(host);
      var c = box.getCenter(new THREE.Vector3());
      var seq = sisSeq[ilk.equip] !== undefined ? sisSeq[ilk.equip] : 2;
      sisSeq[ilk.equip] = seq + 1;
      var v = self.buildValve(null, 'shutdown');
      v.scale.setScalar(2.2);
      v.name = 'XV_' + ilk.tag;
      var pe = self.pipePointEx(ilk.equip, seq);
      if (pe) {
        v.position.copy(pe.p);
        v.rotation.y = Math.atan2(-pe.dz, pe.dx);
      } else {
        var mb = MOUNT_BOX[ilk.equip];
        var halfX = mb ? mb.sx : Math.min(box.getSize(new THREE.Vector3()).x/2, 4.0);
        var vy = 1.05;
        v.position.set(c.x - halfX - 0.75, vy, c.z - 0.55);
        var ped = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, vy, 8), self.makeMetal());
        ped.position.set(v.position.x, vy/2, v.position.z);
        scene.add(ped);
      }
      v.userData.interlock = ilk;
      scene.add(v);
      valveMap.set(ilk.tag, {group: v, loop: null, interlock: ilk});
    });

    console.log('[仪表3D] 挂载检测仪表:', created.size, '| 阀门/切断阀:', valveMap.size);
    return {instruments: created, valves: valveMap};
  },

  // ============================================================
  //  控制阀（气动薄膜调节阀 / 切断阀）
  // ============================================================
  buildValve: function(loop, valveType){
    var g = new THREE.Group();
    g.name = 'VALVE_' + (loop ? loop.tag : 'XV');
    var mm = this.makeMetal();
    var isShutdown = valveType === 'shutdown';
    var actColor = isShutdown ? 0xcc3333 : 0x2f6fbf;
    var actMat = this.makeCase(actColor);

    var body = this._cyl(0.10, 0.10, 0.22, mm, 16);
    body.rotation.z = Math.PI/2; g.add(body);
    [-0.12, 0.12].forEach(function(x){
      var f = this._cyl(0.135, 0.135, 0.025, mm, 16);
      f.rotation.z = Math.PI/2; f.position.x = x; g.add(f);
    }, this);
    var stem = this._cyl(0.018, 0.018, 0.16, this.makeMetal(0xd8dde2), 8);
    stem.name = 'stem';
    stem.position.y = 0.16; g.add(stem);
    var diaphragm = this._cyl(0.17, 0.17, 0.10, actMat, 20);
    diaphragm.position.y = 0.29; g.add(diaphragm);
    var springCase = this._cyl(0.13, 0.13, 0.07, mm, 16);
    springCase.position.y = 0.37; g.add(springCase);
    var poser = this._box(0.10, 0.13, 0.07, this.makeCase(0x33404f));
    poser.position.set(0.17, 0.30, 0); g.add(poser);
    if (isShutdown) {
      var solenoid = this._cyl(0.035, 0.035, 0.09, this.makeGlow(0xff4444), 10);
      solenoid.position.set(-0.17, 0.30, 0); g.add(solenoid);
    } else {
      var ind = this._box(0.05, 0.05, 0.01, this.makeDial());
      ind.position.set(0, 0.29, 0.175); g.add(ind);
    }
    var airLine = this._cyl(0.012, 0.012, 0.20, this.makeMetal(0x88aacc), 8);
    airLine.rotation.z = Math.PI/2;
    airLine.position.set(0.10, 0.44, 0); g.add(airLine);

    g.userData = {loop: loop, isValve: true, tag: loop ? loop.tag : null,
                  valveType: valveType, opening: (loop ? loop.mv : 0)/100};
    g.traverse(function(o){ if(o.isMesh){ o.castShadow = true; } });
    return g;
  }
};

// ============================================================
// 第一人称漫游控制器
// WASD移动 + 鼠标视角(指针锁定) + Shift加速
// ============================================================
var Player = function(camera, domElement, options) {
  var self = this;
  var opts = options || {};
  this.speed = opts.speed || 5.0;
  this.sprintMult = opts.sprintMult || 2.5;
  this.height = opts.height || 1.7;
  this.fov = opts.fov || 60;
  this.enabled = true;
  this.mode = 'walk'; // walk | free

  this.camera = camera;
  this.dom = domElement;
  this.keys = {};
  this.locked = false;
  this.velY = 0;

  // 水平视角
  this.yaw = 0;
  this.pitch = 0;

  // 初始位置
  camera.position.set(0, this.height, 65);
  camera.rotation.order = 'YXZ';
  camera.rotation.x = 0;
  camera.rotation.y = 0;
  camera.rotation.z = 0;
  camera.fov = this.fov;
  camera.updateProjectionMatrix();

  // 事件
  this._onKeyDown = function(e) { self.keys[e.code] = true; };
  this._onKeyUp = function(e) { self.keys[e.code] = false; };

  this._onMouseMove = function(e) {
    if (!self.locked) return;
    var sens = 0.002;
    self.yaw -= e.movementX * sens;
    self.pitch -= e.movementY * sens;
    self.pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, self.pitch));
  };

  this._onMouseDown = function(e) {
    if (!self.locked && self.mode === 'walk' && self.enabled) {
      self.lock();
    }
  };

  this._onLockChange = function() {
    self.locked = (document.pointerLockElement === domElement);
    var hint = document.getElementById('hint');
    if (hint) {
      if (self.locked) {
        hint.textContent = 'WASD移动 · Shift加速 · 鼠标环视 · 点击设备看数据';
        hint.style.color = '#88ccaa';
      } else {
        hint.textContent = '点击画面锁定鼠标进入第一人称漫游 · WASD移动 · Shift加速';
        hint.style.color = '#ffd54f';
      }
    }
  };

  document.addEventListener('keydown', this._onKeyDown);
  document.addEventListener('keyup', this._onKeyUp);
  document.addEventListener('mousemove', this._onMouseMove);
  domElement.addEventListener('mousedown', this._onMouseDown);
  document.addEventListener('pointerlockchange', this._onLockChange);

  this.lock = function() {
    domElement.requestPointerLock();
  };
  this.unlock = function() {
    document.exitPointerLock();
  };

  this.update = function(dt) {
    if (!this.enabled || this.mode !== 'walk') return;
    var speed = this.speed;
    if (this.keys['ShiftLeft'] || this.keys['ShiftRight']) speed *= this.sprintMult;

    var dx = 0, dz = 0;
    var fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(
      new THREE.Quaternion().setFromEuler(new THREE.Euler(0, this.yaw, 0, 'YXZ'))
    );
    var right = new THREE.Vector3(1, 0, 0).applyQuaternion(
      new THREE.Quaternion().setFromEuler(new THREE.Euler(0, this.yaw, 0, 'YXZ'))
    );

    if (this.keys['KeyW'] || this.keys['ArrowUp'])    dz -= 1;
    if (this.keys['KeyS'] || this.keys['ArrowDown'])   dz += 1;
    if (this.keys['KeyA'] || this.keys['ArrowLeft'])   dx -= 1;
    if (this.keys['KeyD'] || this.keys['ArrowRight'])  dx += 1;

    if (dz !== 0 || dx !== 0) {
      var len = Math.sqrt(dx*dx + dz*dz);
      dx /= len; dz /= len;
      var move = new THREE.Vector3();
      move.addScaledVector(fwd, -dz * speed * dt);
      move.addScaledVector(right, dx * speed * dt);
      this.camera.position.add(move);
      // 限制在厂区
      this.camera.position.x = Math.max(-52, Math.min(52, this.camera.position.x));
      this.camera.position.z = Math.max(-52, Math.min(70, this.camera.position.z));
    }

    // 保持人眼高度
    this.camera.position.y = this.height;

    // 应用视角
    this.camera.rotation.set(this.pitch, this.yaw, 0, 'YXZ');
  };

  this.teleport = function(x, y, z, lookX, lookZ) {
    this.camera.position.set(x, this.height, z);
    if (lookX !== undefined && lookZ !== undefined) {
      this.yaw = Math.atan2(lookX - x, lookZ - z);
      this.pitch = 0;
      this.camera.rotation.set(0, this.yaw, 0, 'YXZ');
    }
  };

  this.dispose = function() {
    document.removeEventListener('keydown', this._onKeyDown);
    document.removeEventListener('keyup', this._onKeyUp);
    document.removeEventListener('mousemove', this._onMouseMove);
    this.dom.removeEventListener('mousedown', this._onMouseDown);
    document.removeEventListener('pointerlockchange', this._onLockChange);
  };
};

</script>

      '.sis .sh2{display:flex;justify-content:space-between;font-size:10px;gap:6px}',

      '<div class="hmi-top">',
      '  <h2>🖥 DCS 操作站 — 钒渣提钒制 V₂O₅ 装置</h2>',

      '    <div class="hmi-pane" style="flex:1.15"><h3>控制回路（PID）</h3><div id="hmi-loops"></div></div>',
      '    <div class="hmi-pane" style="flex:1"><h3>SIS 安全联锁</h3><div id="hmi-sis"></div></div>',
      '    <div class="hmi-pane" style="flex:.8"><h3>过程报警</h3><div id="hmi-alarm"></div></div>',

      '</div>'
    ].join('');

    var self = this;
    document.getElementById('hmi-close').onclick = function(){ self.hide(); };

  // ---------------- 实时值（含噪声与故障工况） ----------------
  value: function(m){
    var base = m.pv;
    var isFault = (typeof state !== 'undefined') && state.faults && state.faults.has(m.equip);
    if (isFault && m.faultPv !== undefined) base = m.faultPv;
    if (typeof base !== 'number') return base;
    var ph = (this._noise[m.tag] || 0) + 0.07;
    this._noise[m.tag] = ph;
    var amp = Math.abs(base) * 0.005 + 0.002;
    return base + Math.sin(ph) * amp;
  },

  alarmOf: function(m, v){
    if (typeof v !== 'number') return null;
    if (m.hh !== undefined && v >= m.hh) return {lv:'HH', txt:'高高'};
    if (m.h  !== undefined && v >= m.h ) return {lv:'H',  txt:'高'};
    if (m.ll !== undefined && v <= m.ll) return {lv:'LL', txt:'低低'};
    if (m.l  !== undefined && v <= m.l ) return {lv:'L',  txt:'低'};
    return null;
  },

  fmt: function(v, m){
    if (typeof v !== 'number') return String(v);
    var a = Math.abs(v);
    if (m.unit === 'mg/m³' || m.unit === 'mg/L' || m.unit === 'm³/h' ||
        m.unit === 't/h' || m.unit === 'kg' || m.unit === 'A') return v.toFixed(1);
    if (a >= 100) return v.toFixed(1);
    if (a >= 10)  return v.toFixed(2);
    return v.toFixed(2);
  },

  // ---------------- 渲染：工艺流程图 ----------------
  renderFlow: function(){
    var box = document.getElementById('hmi-flow');
    if (!box) return;
    var self = this;
    // 工段顺序与设备分组
    var SECS = [
      {n:'① 原料与磨矿', eq:['V-101','B-102','B-103','M-104','H-105','T-106']},
      {n:'② 钠化焙烧',   eq:['S-201','K-202','D-203','C-204']},
      {n:'③ 浸出分离',   eq:['R-301','R-302','P-303','F-304']},
      {n:'④ 萃取净化',   eq:['E-401','X-502']},
      {n:'⑤ 沉钒',       eq:['P-501','T-502','P-503']},
      {n:'⑥ 煅烧成品',   eq:['K-601','V-602','W-603','Y-604']},
      {n:'⑦ 环保',       eq:['A-701','A-702','W-703','C-704']},
      {n:'⑧ 公辅',       eq:['S-801','S-802','U-804','E-805','A-807','B-808']},
    ];
    var html = '';
    SECS.forEach(function(sec){
      html += '<div class="sec"><div class="sh">' + sec.n + '</div>';
      sec.eq.forEach(function(tag){
        var list = INSTRUMENTS.filter(function(m){ return m.equip === tag; });
        if (!list.length) return;
        // 每台设备取前 2 个最关键测点（优先带故障工况值或报警限的）
        var key = list.filter(function(m){ return m.faultPv !== undefined; });
        var rest = list.filter(function(m){ return m.faultPv === undefined; });
        var show = key.concat(rest).slice(0, 2);
        var isFault = (typeof state !== 'undefined') && state.faults && state.faults.has(tag);
        show.forEach(function(m, i){
          var v = self.value(m);
          var al = self.alarmOf(m, v);
          var cls = al ? (al.lv === 'HH' || al.lv === 'H' ? 'hi' : 'lo') : '';
          html += '<div class="dev' + (isFault ? ' alm' : '') + '">' +
                  '<span class="dt">' + (i === 0 ? tag + ' ' : '') + m.tag + '</span>' +
                  '<span class="dv ' + cls + '">' + self.fmt(v, m) + ' ' + (m.unit === '—' ? '' : m.unit) + '</span>' +
                  '</div>';
        });
      });
      html += '</div>';
    });
    box.innerHTML = html;
  },

  // ---------------- 渲染：控制回路 ----------------
  renderLoops: function(){
    var box = document.getElementById('hmi-loops');
    if (!box) return;
    var self = this;
    var html = '';
    CONTROL_LOOPS.forEach(function(lp){
      var mode = self._loopMode[lp.tag] || '自动';
      var isFault = (typeof state !== 'undefined') && state.faults && state.faults.has(lp.equip);
      var sp = (mode === '手动') ? (self._loopSp[lp.tag] !== undefined ? self._loopSp[lp.tag] : lp.sp) : lp.sp;
      var mv = (mode === '手动') ? (self._loopMv[lp.tag] !== undefined ? self._loopMv[lp.tag] : lp.mv) : lp.mv;
      // 故障工况：执行机构动作（调节阀趋向全开或全关）
      if (isFault) mv = (lp.tag === 'ARC-501' || lp.tag === 'ARC-701' || lp.tag === 'TRC-202') ? 100 : mv;
      var pvInst = INSTRUMENTS.filter(function(m){ return m.tag === lp.pvTag; })[0];
      var pv = pvInst ? self.value(pvInst) : lp.pv;
      html += '<div class="loop" id="lp-' + lp.tag + '">' +
        '<div class="lh"><span class="lt">' + lp.tag + ' ' + lp.name + '</span>' +
        '<span class="lm ' + (mode === '自动' ? 'auto' : 'man') + '" data-loop="' + lp.tag + '">' + mode + '</span></div>' +
        '<div class="lrow"><label>PV</label><span class="val">' + self.fmt(pv, pvInst || lp) + ' ' + lp.unit + '</span>' +
        '<span style="color:#5f8fae;font-size:9px">' + lp.pvName + '</span></div>' +
        '<div class="lrow"><label>SP</label>' +
        '<input type="range" data-loop="' + lp.tag + '" data-k="sp" min="' + self._rng(lp, 'sp', 0) +
        '" max="' + self._rng(lp, 'sp', 1) + '" step="' + self._rng(lp, 'sp', 2) + '" value="' + sp + '"' +
        (mode === '自动' ? ' disabled' : '') + '>' +
        '<span class="val" id="spv-' + lp.tag + '">' + (typeof sp === 'number' ? sp.toFixed(2) : sp) + '</span></div>' +
        '<div class="lrow"><label>MV</label>' +
        '<input type="range" data-loop="' + lp.tag + '" data-k="mv" min="0" max="100" step="1" value="' + mv + '"' +
        (mode === '自动' ? ' disabled' : '') + '>' +
        '<span class="val" id="mvv-' + lp.tag + '">' + Math.round(mv) + '%</span></div>' +
        '<div style="font-size:9px;color:#5f8fae;margin-top:2px">执行机构: ' + lp.mvName +
        ' · Kp=' + lp.pid.Kp + ' Ti=' + lp.pid.Ti + 's</div>' +
        '</div>';
    });
    box.innerHTML = html;
    // 绑定事件
    box.querySelectorAll('.lm').forEach(function(btn){
      btn.onclick = function(){
        var t = btn.dataset.loop;
        var cur = self._loopMode[t] || '自动';
        self._loopMode[t] = (cur === '自动') ? '手动' : '自动';
        if (self._loopMode[t] === '手动') {
          var lp = CONTROL_LOOPS.filter(function(x){return x.tag===t;})[0];
          if (lp && self._loopSp[t] === undefined) { self._loopSp[t] = lp.sp; self._loopMv[t] = lp.mv; }
        }
        self.renderLoops();
      };
    });
    box.querySelectorAll('input[type=range]').forEach(function(r){
      r.oninput = function(){
        var t = r.dataset.loop, k = r.dataset.k;
        if (k === 'sp') { self._loopSp[t] = parseFloat(r.value);
          var e = document.getElementById('spv-' + t); if (e) e.textContent = parseFloat(r.value).toFixed(2); }
        else { self._loopMv[t] = parseFloat(r.value);
          var e2 = document.getElementById('mvv-' + t); if (e2) e2.textContent = Math.round(r.value) + '%'; }
      };
    });
  },

  // SP 滑块量程（围绕设定值上下浮动）
  _rng: function(lp, key, which){
    if (key !== 'sp') return 0;
    var s = lp.sp;
    var span = Math.max(Math.abs(s) * 0.6, 1);
    var lo = Math.max(0, s - span), hi = s + span;
    if (lp.unit === 'Pa') { lo = s - 200; hi = s + 200; }
    if (lp.unit === 'mm') { lo = -250; hi = 250; }
    var step = (hi - lo) > 50 ? 1 : 0.05;
    return [lo, hi, step][which];
  },

  // ---------------- 渲染：报警 ----------------
  renderAlarm: function(){
    var box = document.getElementById('hmi-alarm');
    if (!box) return;
    var self = this;
    var rows = [];
    INSTRUMENTS.forEach(function(m){
      var v = self.value(m);
      var al = self.alarmOf(m, v);
      if (al) rows.push({m:m, v:v, al:al});
    });
    rows.sort(function(a,b){
      var o = {HH:0, LL:1, H:2, L:3};
      return (o[a.al.lv]||9) - (o[b.al.lv]||9);
    });
    if (!rows.length) {
      box.innerHTML = '<div class="ok-row">✔ 无过程报警，装置运行正常</div>';
      return;
    }
    box.innerHTML = rows.slice(0, 40).map(function(r){
      return '<div class="alm-row ' + r.al.lv + '">' +
        '<span>' + r.al.txt + ' · ' + r.m.tag + ' ' + r.m.name + '</span>' +
        '<span>' + self.fmt(r.v, r.m) + ' ' + r.m.unit + '</span></div>';
    }).join('') + (rows.length > 40 ? '<div class="ok-row">… 另有 ' + (rows.length-40) + ' 条</div>' : '');
  },

  // ---------------- 渲染：SIS 联锁 ----------------
  renderSIS: function(){
    var box = document.getElementById('hmi-sis');
    if (!box) return;
    var html = '';
    INTERLOCKS.forEach(function(ilk){
      var trip = (typeof state !== 'undefined') && state.faults && state.faults.has(ilk.faultTag);
      var silCls = ilk.sil === 3 ? 's3' : (ilk.sil === 2 ? 's2' : '');
      html += '<div class="sis' + (trip ? ' trip' : '') + '">' +
        '<div class="sh2"><span style="color:#9fd0ff">' + ilk.tag + ' ' + ilk.name + '</span>' +
        '<span><span class="sil ' + silCls + '">SIL' + ilk.sil + '</span> ' +
        '<span class="st">' + (trip ? '已动作' : '正常') + '</span></span></div>' +
        '<div class="sd">传感器: ' + ilk.sensor + '（' + ilk.logic + '）<br>' +
        '触发: ' + ilk.trip + '<br>' +
        '动作: <span style="color:' + (trip ? '#ff9999' : '#8fb8dd') + '">' + ilk.action + '</span></div>' +
        '</div>';
    });
    html += '<div style="font-size:9px;color:#5f8fae;margin-top:5px;line-height:1.5">' +
      '机械保护（独立于SIS）: ' + PSV_LIST.map(function(p){return p.tag + '(' + p.set + ')';}).join(' · ') +
      '<br>SIS 与 DCS 独立设置，符合 IEC 61511 / GB 50770</div>';
    box.innerHTML = html;
  },

  // ---------------- 刷新 ----------------
  tick: function(){
    if (!this.visible) return;
    this.renderFlow();
    this.renderLoops();
    this.renderAlarm();
    this.renderSIS();
    var c = document.getElementById('hmi-clock');
    if (c) { var d = new Date();
      c.textContent = '系统时间 ' + d.toLocaleTimeString('zh-CN', {hour12:false}); }
  },

  // ---------------- 显示 / 隐藏 ----------------
  show: function(){
    this.build();
    this.visible = true;
    this.root.classList.add('on');
    this.tick();
    var self = this;
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(function(){ self.tick(); }, 1000);
  },
  hide: function(){
    this.visible = false;
    if (this.root) this.root.classList.remove('on');
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },
  toggle: function(){ this.visible ? this.hide() : this.show(); }
};

</script>
<script>
/* ===== 内联: factory.js ===== */
// ============================================================
// 三维钒渣提钒虚拟仿真工厂 — 主引擎 v2
// 代码级精细设备 + 管线 + 第一人称漫游
// 加载顺序: lib/three.min.js → equipment_data.js
//          → lib/equip_builders.js → lib/pipes.js → lib/scene_env.js
//          → lib/player.js → factory.js
// ============================================================

// ---------- 全局状态 ----------
var state = {
  mode: 'walk',
  selectedTag: null,
  faults: new Set(),
  xray: false,
  labelsOn: true,
  slowMode: false,
  tourIndex: 0,
  tourTimer: 0,
  showInstr: false,     // 三维仪表点位是否显示
  instrMap: null,       // 仪表 tag -> {group, instr, host}
  valveMap: null,       // 回路/联锁 tag -> {group, loop, interlock}
  motionOn: true,       // 设备运转动画总开关
  motionSpeed: 1,       // 运转动画倍率（0.5 / 1 / 2 / 4）
  sectionMode: false,   // 剖面模式（选中设备剖切看内部）
  flowOn: true,         // 管线物料流动指示
};

// ---------- 场景初始化 ----------
var canvas = document.getElementById('c');
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5d6);
scene.fog = new THREE.Fog(0x87b5d6, 80, 250);

var camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// 启用局部裁剪：剖切模式下用平面切掉设备靠观察者一侧的外壳，露出内部结构
renderer.localClippingEnabled = true;

// ---------- 光照 ----------
var amb = new THREE.AmbientLight(0xaabbdd, 0.4); scene.add(amb);
var hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a5a3a, 0.5); scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff5e0, 1.0);
sun.position.set(60, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
sun.shadow.camera.far = 300;
scene.add(sun);

// ---------- 工段色标 ----------
var SECTION_COLORS = {
  "原料准备":0x4488ff,"焙烧":0xff6633,"浸出":0x33cc99,"固液分离":0x66ccff,
  "净化":0xcc88ff,"沉淀":0xffcc44,"产品":0xff4466,"成品":0x88ff44,
  "环保":0x44ccaa,"公辅":0x8899bb,"场景":0x667788
};

// ---------- 设备模型加载 ----------
var equipMeshes = new Map();
var B = EQUIP_BUILDERS;
var player = null; // 由 init() 初始化

function buildAllEquipment() {
  EQUIPMENT.forEach(function(eq) {
    var builder = B[eq.tag] || B._default;
    var group = builder.call(B, scene, eq);
    group.userData = { tag: eq.tag, eq: eq }; // 设置 userData 供射线拾取用
    equipMeshes.set(eq.tag, group);
  });
}

// ---------- 设备标签 ----------
var labelDivs = new Map();
function buildLabels() {
  var container = document.createElement('div');
  container.id = 'labels-layer';
  container.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden;';
  document.body.appendChild(container);
  EQUIPMENT.forEach(function(eq) {
    var div = document.createElement('div');
    div.className = 'elabel';
    div.innerHTML = '<span class="t">' + eq.tag + '</span>';
    div.style.display = eq.key ? 'block' : 'none';
    container.appendChild(div);
    labelDivs.set(eq.tag, div);
  });
}
buildLabels();

function updateLabels() {
  if (!state.labelsOn) {
    labelDivs.forEach(function(d){d.style.display='none';});
    return;
  }
  var w = innerWidth, h = innerHeight;
  equipMeshes.forEach(function(group, tag) {
    var eq = group.userData.eq;
    if (!eq) return;
    var div = labelDivs.get(tag);
    if (!div) return;
    if (state.faults.has(tag) || state.selectedTag === tag || eq.key) {
      var v = new THREE.Vector3();
      group.getWorldPosition(v);
      v.y += 3.5;
      v.project(camera);
      var x = (v.x*0.5+0.5)*w;
      var y = (-v.y*0.5+0.5)*h;
      if (v.z < 1) {
        div.style.display = 'block';
        div.style.transform = 'translate(-50%,-100%) translate(' + x + 'px,' + y + 'px)';
        div.style.top = '0'; div.style.left = '0';
      } else { div.style.display = 'none'; }
    } else { div.style.display = 'none'; }
  });
}

// ---------- 数据面板 ----------
function updateDataPanel() {
  var titleEl = document.getElementById('eq-title');
  var tagEl   = document.getElementById('eq-tag');
  var secEl   = document.getElementById('eq-sec');
  var tableEl = document.getElementById('ptable');
  var alertEl = document.getElementById('alert');
  var dotEl   = document.getElementById('dot');
  var kpi     = document.getElementById('kpi-st');

  if (!state.selectedTag) {
    titleEl.textContent = '未选择设备';
    tagEl.textContent = '—';
    secEl.textContent = '走近设备或点击面板选择';
    tableEl.innerHTML = '';
    document.getElementById('inst-sec').innerHTML = '';
    document.getElementById('sis-sec').innerHTML = '';
    alertEl.classList.remove('show');
    dotEl.style.background = '#3ddc84';
    kpi.textContent = state.faults.size ? '⚠ ' + state.faults.size + ' 故障' : '正常';
    kpi.style.color = state.faults.size ? '#ff8a8a' : '#63d2ff';
    return;
  }

  var eq = EQUIPMENT.find(function(e){return e.tag === state.selectedTag;});
  if (!eq) return;
  var isFault = state.faults.has(eq.tag);
  titleEl.textContent = eq.name;
  tagEl.textContent = eq.tag;
  secEl.textContent = eq.section + ' 工段';

  var params = isFault && eq.fault ? eq.fault.params : eq.params;
  tableEl.innerHTML = params.map(function(p){
    return '<tr><td>' + p[0] + '</td><td>' + p[1] + '</td></tr>';
  }).join('');

  // 仪表系统：渲染该设备的检测仪表点位与 SIS 联锁
  renderInstrumentPanel(eq);
  renderSISPanel(eq);

  if (isFault && eq.fault) {
    alertEl.textContent = eq.fault.msg;
    alertEl.classList.add('show');
    dotEl.style.background = '#ff3333';
    dotEl.style.boxShadow = '0 0 8px #ff3333';
  } else {
    alertEl.classList.remove('show');
    dotEl.style.background = '#3ddc84';
    dotEl.style.boxShadow = '0 0 8px #3ddc84';
  }
  kpi.textContent = state.faults.size ? '⚠ ' + state.faults.size + ' 故障' : '正常';
  kpi.style.color = state.faults.size ? '#ff8a8a' : '#63d2ff';
}

// ---------- 仪表系统：三维显示开关 ----------
function setInstrVisible(on) {
  state.showInstr = on;
  if (state.instrMap) state.instrMap.forEach(function(o){ o.group.visible = on; });
  if (state.valveMap) state.valveMap.forEach(function(o){ o.group.visible = on; });
}

// ---------- 仪表系统：右侧面板渲染该设备仪表点位 ----------
function renderInstrumentPanel(eq) {
  var box = document.getElementById('inst-sec');
  if (!box) return;
  if (!eq || typeof INSTRUMENTS === 'undefined') { box.innerHTML = ''; return; }
  var list = INSTRUMENTS.filter(function(m){ return m.equip === eq.tag; });
  if (!list.length) { box.innerHTML = ''; return; }
  var meta = function(t){ return (typeof INSTR_META!=='undefined' && INSTR_META[t]) ? INSTR_META[t].icon : '•'; };
  var html = '<div class="isec"><div class="h">📡 检测仪表点位（' + list.length + ' 点）</div>' +
             '<table class="itab">';
  list.forEach(function(m){
    var v = HMI.value(m);
    var al = HMI.alarmOf(m, v);
    var isFault = state.faults.has(eq.tag);
    html += '<tr class="' + (al ? 'act' : '') + '">' +
            '<td class="i0">' + meta(m.type) + ' ' + m.tag + '</td>' +
            '<td class="i1">' + m.name + '</td>' +
            '<td class="i2' + (al ? ' a' : '') + '">' + HMI.fmt(v, m) + ' ' + m.unit + '</td>' +
            '</tr>';
  });
  html += '</table></div>';
  box.innerHTML = html;
}

// ---------- 仪表系统：右侧面板渲染 SIS 安全联锁 ----------
function renderSISPanel(eq) {
  var box = document.getElementById('sis-sec');
  if (!box) return;
  if (!eq || typeof INTERLOCKS === 'undefined') { box.innerHTML = ''; return; }
  var list = INTERLOCKS.filter(function(x){ return x.equip === eq.tag; });
  if (!list.length) { box.innerHTML = ''; return; }
  var isFault = state.faults.has(eq.tag);
  var html = '<div class="isec"><div class="h">🛡 SIS 安全联锁（' + list.length + ' 条）</div>';
  list.forEach(function(ilk){
    var trip = isFault;
    html += '<div style="font-size:9px;padding:4px 5px;margin-bottom:3px;border-radius:3px;' +
      (trip ? 'background:#3d1a1a;border-left:3px solid #b83030;'
            : 'background:#0f2038;border-left:3px solid #2a5bb8;') + '">' +
      '<div style="display:flex;justify-content:space-between;gap:4px">' +
      '<span style="color:#ffd54f;font-weight:bold">' + ilk.tag + '</span>' +
      '<span style="color:' + (trip ? '#ff6666' : '#7fffa8') + ';font-weight:bold">SIL' + ilk.sil +
      ' ' + (trip ? '已动作' : '正常') + '</span></div>' +
      '<div style="color:#9db8e8;margin-top:2px">传感器 ' + ilk.sensor + '（' + ilk.logic + '）</div>' +
      '<div style="color:#cfe3f5">触发：' + ilk.trip + '</div>' +
      '<div style="color:' + (trip ? '#ffb3b3' : '#7fa8cc') + '">动作：' + ilk.action + '</div>' +
      '</div>';
  });
  html += '</div>';
  box.innerHTML = html;
}

// ---------- 仪表系统：SIS 联锁动作（3D 高亮仪表与切断阀）----------
function applySISAction(tag, active) {
  if (!state.valveMap && !state.instrMap) return;
  // 切断阀：红色 emissive
  if (state.valveMap) {
    state.valveMap.forEach(function(o){
      var ilk = o.group.userData.interlock;
      if (ilk && ilk.faultTag === tag) {
        o.group.traverse(function(m){
          if (m.isMesh) {
            if (active) { m.material.emissive = new THREE.Color(0x991111); m.material.emissiveIntensity = 0.95; }
            else { m.material.emissive = new THREE.Color(0x000000); m.material.emissiveIntensity = 0; }
          }
        });
      }
    });
  }
  // 该设备上的检测仪表：报警高亮
  if (state.instrMap) {
    state.instrMap.forEach(function(o){
      if (o.host === tag) {
        o.group.traverse(function(m){
          if (m.isMesh) {
            if (active) { m.material.emissive = new THREE.Color(0x771111); m.material.emissiveIntensity = 0.85; }
            else { m.material.emissive = new THREE.Color(0x000000); m.material.emissiveIntensity = 0; }
          }
        });
      }
    });
  }
}

// ---------- 射线拾取 ----------
var raycaster = new THREE.Raycaster();
var mouse = new THREE.Vector2();

function onMouseMove(e) {
  if (state.mode !== 'walk' || !document.pointerLockElement) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(Array.from(equipMeshes.values()), true);
  var hovered = null;
  if (hits.length) {
    var obj = hits[0].object;
    var parent = obj.parent;
    if (parent && parent.userData && parent.userData.tag) hovered = parent.userData.tag;
  }
  document.body.style.cursor = hovered ? 'crosshair' : 'default';
  if (hovered && hovered !== state.selectedTag) {
    // 自动靠近检测
    var group = equipMeshes.get(hovered);
    if (group) {
      var dist = camera.position.distanceTo(group.position);
      if (dist < 12) {
        selectEquip(hovered);
      }
    }
  }
}

function onClick(e) {
  if (state.mode !== 'walk') return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(Array.from(equipMeshes.values()), true);
  if (hits.length) {
    var group = hits[0].object.parent;
    var tag = group && group.userData ? group.userData.tag : null;
    if (tag) selectEquip(tag);
  } else {
    selectEquip(null);
  }
}
canvas.addEventListener('mousemove', onMouseMove);
canvas.addEventListener('click', onClick);

// ---------- 故障触发 ----------
function triggerFault(name) {
  var scenario = FAULT_SCENARIOS[name];
  if (!scenario) {
    alert('未识别的故障类型：「' + name + '」\n可用：' + Object.keys(FAULT_SCENARIOS).join(' / '));
    return;
  }
  var tag = scenario.tag;
  if (!state.faults.has(tag)) {
    state.faults.add(tag);
    var group = equipMeshes.get(tag);
    var eq = EQUIPMENT.find(function(e){return e.tag === tag;});
    if (group && eq) applyFaultMaterial(group, eq, true);
    applySISAction(tag, true);   // SIS 联锁动作：切断阀/仪表报警高亮
    if (eq) { selectEquip(tag); teleportTo(eq); }
    updateAlarmBar(); updateDataPanel(); updateLabels();
  }
}

function applyFaultMaterial(group, eq, active) {
  var baseColor = SECTION_COLORS[eq.section] || 0x667788;
  group.traverse(function(obj) {
    if (obj.isMesh) {
      if (active) {
        obj.material.emissive = new THREE.Color(0x661111);
        obj.material.emissiveIntensity = 0.5;
      } else {
        obj.material.emissive = new THREE.Color(0x000000);
        obj.material.emissiveIntensity = 0;
      }
    }
  });
}

function resetAll() {
  state.faults.clear();
  selectEquip(null);
  EQUIPMENT.forEach(function(eq) {
    var group = equipMeshes.get(eq.tag);
    if (group) applyFaultMaterial(group, eq, false);
    applySISAction(eq.tag, false);   // 复位 SIS 联锁高亮
  });
  updateAlarmBar(); updateDataPanel(); updateLabels();
}

// ---------- 瞬移到设备 ----------
function teleportTo(eq) {
  var pos = new THREE.Vector3(eq.pos[0], 0, eq.pos[2]);
  // 站在设备前方
  var offset = new THREE.Vector3(0, 0, 5).applyQuaternion(
    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, player.yaw, 0))
  );
  var target = pos.clone().sub(new THREE.Vector3(offset.x, 0, offset.z));
  target.y = 0;
  target.x = Math.max(-52, Math.min(52, target.x));
  target.z = Math.max(-52, Math.min(70, target.z));
  player.teleport(target.x, 0, target.z, eq.pos[0], eq.pos[2]);
}

// ---------- 显示切换 ----------
// ============================================================
//  剖切模式：用裁剪平面切掉选中设备靠观察者一侧的外壳，
//  露出真实内部结构（窑内物料层、磨机钢球、滤饼、料舟、填料…）
// ============================================================
var sectionPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
var sectionedTag = null;

function clearSection(){
  if (!sectionedTag) return;
  var g = equipMeshes.get(sectionedTag);
  if (g) {
    g.traverse(function(o){
      if (o.isMesh && o.material) {
        o.material.clippingPlanes = null;
        o.material.side = THREE.FrontSide;
        o.material.needsUpdate = true;
        if (o.userData.isCake || o.userData.isCharge || o.userData.isBoat) {
          if (o.material.emissive) {
            o.material.emissive.setHex(0x000000);
            o.material.emissiveIntensity = 0;
          }
        }
      }
    });
  }
  sectionedTag = null;
}

function applySection(){
  clearSection();
  if (!state.sectionMode) return;
  var tag = state.selectedTag;
  if (!tag) return;
  var g = equipMeshes.get(tag);
  if (!g) return;
  g.traverse(function(o){
    if (o.isMesh && o.material) {
      o.material.clippingPlanes = [sectionPlane];
      o.material.side = THREE.DoubleSide;      // 切开后能看到壳体内壁
      o.material.needsUpdate = true;
      // 内部构件高亮，剖开后一眼可见
      if (o.userData.isCake || o.userData.isCharge || o.userData.isBoat) {
        o.material.emissive.setHex(0x885533);
        o.material.emissiveIntensity = 0.6;
      }
    }
  });
  sectionedTag = tag;
}

// 每帧更新剖切平面：始终切掉朝向摄像机的那一半
function updateSectionPlane(){
  if (!state.sectionMode || !sectionedTag) return;
  var g = equipMeshes.get(sectionedTag);
  if (!g) return;
  var box = new THREE.Box3().setFromObject(g);
  var c = box.getCenter(new THREE.Vector3());
  var n = new THREE.Vector3().subVectors(camera.position, c);
  n.y = 0;
  if (n.lengthSq() < 0.001) n.set(0, 0, 1);
  n.normalize();
  sectionPlane.normal.copy(n);
  sectionPlane.constant = -n.dot(c) + 0.30;   // 略偏向观察者，确保切开
}

function setHint(msg){
  var el = document.getElementById('hint');
  if (el) el.textContent = msg;
}

function toggleSection(){
  state.sectionMode = !state.sectionMode;
  var btn = document.getElementById('btn-section');
  if (btn) btn.classList.toggle('active', state.sectionMode);
  if (!state.sectionMode) { clearSection(); setHint('已退出剖切模式'); return; }
  if (!state.selectedTag) {
    state.sectionMode = false;
    if (btn) btn.classList.remove('active');
    setHint('请先在场景中选中一台设备，再开启剖切');
    return;
  }
  applySection();
  setHint('剖切模式：已切开 ' + state.selectedTag + ' 外壳，可见内部结构');
}

var TOUR = [
  {name:'原料与磨矿', pos:[0, 0, -40]},
  {name:'钠化焙烧',   pos:[0, 0, -15]},
  {name:'浸出分离',   pos:[-4, 0, 8]},
  {name:'萃取净化',   pos:[-8, 0, 26]},
  {name:'沉钒',       pos:[-8, 0, 38]},
  {name:'煅烧成品',   pos:[8, 0, 46]},
  {name:'环保公辅',   pos:[28, 0, 10]},
  {name:'全厂鸟瞰',   pos:[0, 0, 70]},
];
var autoTour = false;
var camAnim = {active: false, from: null, to: null, lookFrom: null, lookTo: null, t: 0, dur: 1.8};

function startAutoTour() {
  autoTour = true;
  state.tourIndex = 0;
  flyTo(TOUR[0].pos, TOUR[0].pos);
}
function stopAutoTour() {
  autoTour = false;
  camAnim.active = false;
}
function flyTo(pos, lookAt, dur) {
  camAnim.from = camera.position.clone();
  camAnim.to = new THREE.Vector3(pos[0], 12, pos[2] + 8);
  camAnim.lookFrom = new THREE.Vector3(0, 2, 0);
  camAnim.lookTo = new THREE.Vector3(lookAt[0], 3, lookAt[2]);
  camAnim.t = 0;
  camAnim.dur = dur || 1.8;
  camAnim.active = true;
}
function updateCamAnim(dt) {
  if (!camAnim.active) return;
  camAnim.t += dt / camAnim.dur;
  var t = Math.min(camAnim.t, 1);
  var ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  camera.position.lerpVectors(camAnim.from, camAnim.to, ease);
  var look = camAnim.lookFrom.clone().lerp(camAnim.lookTo, ease);
  camera.lookAt(look);
  if (t >= 1) camAnim.active = false;
}

var clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  var dt = clock.getDelta();

  // 第一人称漫游
  if (state.mode === 'walk') {
    player.update(dt);
  }

  // 自动巡览

      flyTo(TOUR[state.tourIndex].pos, TOUR[state.tourIndex].pos, 2.0);

    if (g) selBox.update();
  }

  // ---------- 设备运转动画（真实转速驱动）----------
  updateMotion(dt);

  // ---------- 管线物料流动（沿管走向的流动色环）----------
  updateFlow(dt);

  // 控制阀阀杆微动（模拟气动薄膜执行机构调节）
  if (state.showInstr && state.valveMap) {
    var ph = performance.now() / 1000;
    state.valveMap.forEach(function(o, k){
      var stem = o.group.getObjectByName('stem');
      if (stem && stem.isMesh) {
        var amp = 0.012 * (o.group.userData.loop ? 1 : 0.4);
        stem.position.y = 0.16 + Math.sin(ph * 1.6 + k.length) * amp;
      }
    });
  }

  renderer.render(scene, camera);
}

// ============================================================
//  设备运转动画系统
// ------------------------------------------------------------
//  设备在建模时通过 EQUIP_BUILDERS._spin() / _osc() 给运动部件
//  登记真实额定转速，这里统一驱动，使虚拟工厂"看得见在运转"。
// ============================================================

// 真实转速 → 视觉角速度(r/min)：
//   · 高速设备（电机 1450/2900 r/min）压缩，否则帧间角度过大造成频闪
//   · 低速设备（回转窑 2.4、耙架 0.35 r/min）放大，否则肉眼几乎看不出
function visualRpm(rpm){
  var r = Math.abs(rpm);
  if (r <= 0) return 0;
  if (r > 240) return 240 + (r - 240) * 0.12;
  if (r < 3)   return r * 4.0;
  return r;
}

function collectMotionParts(g){
  var parts = [];
  g.updateMatrixWorld(true);          // 先更新世界矩阵，才能量出正确的几何中心
  g.traverse(function(o){
    if (o.userData && o.userData.motion) {
      var m = o.userData.motion;
      m._base = o.position.clone();           // 记初始位置，往复运动围绕它摆动
      m._phase = Math.random() * Math.PI * 2; // 随机相位，避免全场同步摆动
      if (m.kind === 'spin') {
        // 旋转轴心：优先用建模时显式指定的（如回转窑的窑轴标高）；
        // 否则自动取该部件几何中心（父坐标系下）—— 保证"绕自身轴转"，
        // 而不是绕设备地面原点甩起来（旧 bug：窑体/磨机因此上下翻飞）
        if (m.pivot) {
          m._pivot = m.pivot.clone();
        } else {
          var box = new THREE.Box3().setFromObject(o);
          var c = box.getCenter(new THREE.Vector3());
          if (isFinite(c.x) && isFinite(c.y) && isFinite(c.z) && o.parent) {
            o.parent.worldToLocal(c);          // 世界坐标 → 父坐标系
          } else {
            c.set(0, 0, 0);
          }
          m._pivot = c;
        }
      }
      parts.push(o);
    }
  });
  return parts;
}

// 旋转轴方向单位向量（父坐标系）
var SPIN_AXES = {
  x: new THREE.Vector3(1, 0, 0),
  y: new THREE.Vector3(0, 1, 0),
  z: new THREE.Vector3(0, 0, 1)
};
var _spinQ = new THREE.Quaternion();

var motionT = 0;
function updateMotion(dt){
  if (!state.motionOn) return;
  motionT += dt;
  var scale = state.motionSpeed || 1;
  equipMeshes.forEach(function(g){
    if (!g) return;
    if (!g.userData._motionParts) g.userData._motionParts = collectMotionParts(g);
    var parts = g.userData._motionParts;
    // 故障设备停机（红色高亮）时停止运转，直观表达"已停机"
    var stopped = state.faults && state.faults.has(g.name);
    if (stopped) return;
    for (var i = 0; i < parts.length; i++){
      var o = parts[i], m = o.userData.motion;
      if (m.kind === 'spin') {
        // 绕「过轴心 pivot、方向 axis」的轴做增量旋转。
        // 同时更新 position 与 quaternion（左乘=绕父坐标系轴），保证轴心不动、只自转。
        var av = visualRpm(m.rpm) / 60 * Math.PI * 2 * scale * dt;
        _spinQ.setFromAxisAngle(SPIN_AXES[m.axis] || SPIN_AXES.y, av);
        var p = m._pivot;
        o.position.sub(p).applyQuaternion(_spinQ).add(p);
        o.quaternion.premultiply(_spinQ);
      } else if (m.kind === 'osc') {
        var s = Math.sin(motionT * m.freq * Math.PI * 2 * scale + m._phase);
        if (Object.prototype.toString.call(m.amp) === '[object Array]') {
          // 斜向联动：沿指定方向向量往复（如矿石沿倾斜皮带移动，X/Y 同步）
          o.position.set(m._base.x + (m.amp[0] || 0) * s,
                         m._base.y + (m.amp[1] || 0) * s,
                         m._base.z + (m.amp[2] || 0) * s);
        } else {
          var b = m._base ? m._base[m.axis] : 0;
          o.position[m.axis] = b + s * m.amp;
        }
      }
    }
  });
}

// ============================================================
//  管线物料流动指示：沿管线走向循环移动的亮色小球
//  真实工厂靠它判断流向；教学中可直观看到"料往哪走"
// ============================================================
var flowMarkers = null;
function buildFlowMarkers(){
  flowMarkers = [];
  if (typeof PIPE_ROUTES === 'undefined') return;
  var mat = new THREE.MeshBasicMaterial({color: 0xffe066});
  var geo = new THREE.SphereGeometry(0.17, 8, 6);
  for (var i = 0; i < PIPE_ROUTES.length; i++){
    var pts = PIPE_ROUTES[i];
    if (!pts || pts.length < 2) continue;
    var m = new THREE.Mesh(geo, mat);
    m.userData = {route: pts, t: Math.random()};
    scene.add(m);
    flowMarkers.push(m);
  }
}

function updateFlow(dt){
  if (!state.flowOn) {
    if (flowMarkers) flowMarkers.forEach(function(m){ m.visible = false; });
    return;
  }
  if (!flowMarkers) buildFlowMarkers();
  if (!flowMarkers) return;
  for (var i = 0; i < flowMarkers.length; i++){
    var m = flowMarkers[i];
    m.visible = true;
    var pts = m.userData.route;
    m.userData.t += dt * 0.10 * (state.motionSpeed || 1);
    if (m.userData.t > 1) m.userData.t -= 1;
    var t = m.userData.t * (pts.length - 1);
    var i0 = Math.floor(t), i1 = Math.min(i0 + 1, pts.length - 1);
    var f = t - i0;
    m.position.lerpVectors(pts[i0], pts[i1], f);
  }
}

// ---------- 启动 ----------
(function init() {
  // 1. 构建厂区环境
  buildSceneEnvironment(scene);

  // 2. 构建全部设备
  buildAllEquipment();

  // 3. 构建管线系统（必须先于仪表：流量计/压力变送器要装在管道上）
  //    传入设备网格：接管口用射线实测设备真实表面，杜绝"管道没有来处/去处"
  buildPipes(scene, equipMeshes);

  // 4. 构建仪表系统：检测仪表 + 控制阀 + SIS 切断阀
  //    流量计按真实做法夹装在管道上，其余按安装支架固定在设备本体
  var instRes = INSTRUMENT_BUILDERS.mountAll(scene, equipMeshes);
  state.instrMap = instRes.instruments;
  state.valveMap = instRes.valves;
  // 默认显示三维仪表（含就地表盘与位号浮标），可用左侧「三维仪表点位」按钮关闭
  setInstrVisible(true);

  // 4. 创建第一人称控制器
  player = new Player(camera, canvas, {speed: 5.0, height: 1.7, fov: 60});

  // 5. 初始视角 — 厂区大门处
  camera.position.set(0, 1.7, 65);
  camera.lookAt(0, 2, 0);
  player.yaw = Math.PI; // 面向厂区内部

  // 6. UI 初始化
  selectEquip(null);
  updateAlarmBar();
  updateDataPanel();
  updateLabels();

  // 7. 隐藏加载进度
  document.getElementById('load').style.display = 'none';

  // 8. 启动渲染循环
  animate();

  console.log('三维钒渣提钒虚拟仿真工厂 v5 已启动（含仪表系统）');
  console.log('  设备总数:', EQUIPMENT.length);
  console.log('  巡览点:', TOUR.length);
  console.log('  故障剧本:', Object.keys(FAULT_SCENARIOS).length);
  console.log('  管线数:', PIPE_DEFS.length);
  if (typeof INSTRUMENTS !== 'undefined') {
    console.log('  检测仪表:', INSTRUMENTS.length,
                '| 控制回路:', CONTROL_LOOPS.length,
                '| SIS联锁:', INTERLOCKS.length,
                '| 机械保护:', PSV_LIST.length);
    console.log('  DCS I/O: AI', DCS_INFO.ai, 'AO', DCS_INFO.ao,
                'DI', DCS_INFO.di, 'DO', DCS_INFO.do_);
  }
})();

</script>
